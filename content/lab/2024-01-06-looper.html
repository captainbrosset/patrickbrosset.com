        this.el.appendChild(this.deleteButton);
      }

      setSync(playEntireBufferBeforeRepeat) {
        this.playEntireBufferBeforeRepeat = playEntireBufferBeforeRepeat;
        this.syncButton.classList.toggle("active", !playEntireBufferBeforeRepeat);
        this.syncButton.innerHTML = playEntireBufferBeforeRepeat ? "<span>sync</span>" : "<span>unsync</span>";
      }

      setSource(source) {
        this.source = source;
        this.sourceSelect.value = source;
      }

      // Sets the track's group, and moves it inside the group's module (or out of it),
      // unless `move` is false because the element was already put in place.
      setGroup(group, { move = true } = {}) {
        const previous = this.group;
        this.group = group;
        if (move) {
          if (group && this.el.parentElement !== group.tracksEl) {
            moveNode(group.tracksEl, this.el, null);
          } else if (!group && this.el.parentElement !== tracksEl) {
            // Put it right after the group it was in.
            const before = previous && previous.el.isConnected ? previous.el.nextSibling : tracksActions;
            moveNode(tracksEl, this.el, before);
          }
        }
        this.renderGroupOptions();
        applyAllGains();
        refreshGroupCounts();
      }

      renderGroupOptions() {
        this.groupSelect.replaceChildren(new Option("-", ""), ...groups.map(g => new Option(g.nameInput.value, g.id)));
        this.groupSelect.value = this.group ? this.group.id : "";
      }

      // Whether the track is heard while soloing: soloed itself (even if muted), or
      // in a soloed group (unless muted).
      isHeardInSolo() {
        return this.isSoloed || !!(this.group && this.group.isSoloed && !this.isMuted);
      }

      // When some tracks or groups are soloed, only those are heard.
      isAudible() {
        if (this.gainValue <= 0) {
          return false;
        }
        if (isAnythingSoloed()) {
          return this.isHeardInSolo();
        }
        return !this.isMuted && !(this.group && this.group.isMuted);
      }

      setSolo(isSoloed) {
        this.isSoloed = isSoloed;
        this.soloButton.classList.toggle("active", isSoloed);
        // A soloed track is meant to be heard.
        if (isSoloed && this.isMuted) {
          this.unmute();
        }
        applyAllGains();
      }

      // Copies the recording and all the settings of `source` into this track.
      copyFrom(source) {
        this.nameInput.value = `${source.nameInput.value} copy`.slice(0, this.nameInput.maxLength);
        this.gainValue = source.gainValue;
        this.gainRangeEl.value = source.gainRangeEl.value;
        if (source.isMuted) {
          this.mute();
        } else {
          this.unmute();
        }
        this.setSync(source.playEntireBufferBeforeRepeat);
        this.setSource(source.source);
        this.setGroup(source.group);
        this.setSolo(source.isSoloed);
        this.setVideoVisible(source.isVideoVisible);

        if (!source.buffer) {
          return;
        }

        this.videoFrames = source.videoFrames;
        this.updateVideoToggle();

        this.state = 2;
        this.el.classList.add("has-buffer");
        this.screenStatus.textContent = "status: playing";
        this.buffer = source.buffer;
        this.rawPeaks = source.rawPeaks;
        this.trimStart = source.trimStart;
        this.trimEnd = source.trimEnd;
        this.anchorTime = source.anchorTime;
        this.offset = source.offset;
        this.play();
      }

      applyGain() {
        const groupMuted = !!(this.group && this.group.isMuted);
        this.el.classList.toggle("group-muted", groupMuted && !isAnythingSoloed());
        this.el.classList.toggle("solo-silenced", isAnythingSoloed() && !this.isHeardInSolo());
        const value = this.isAudible() ? this.gainValue : 0;
        this.outputGain.gain.setTargetAtTime(value, audioContext.currentTime, 0.01);
      }

      toggleMute() {
        if (this.isMuted) {
          this.unmute();
        } else {
          this.mute();
        }
      }

      mute() {
        this.muteButton.innerHTML = "<span>unmute</span>";
        this.muteButton.classList.add("active");

        this.isMuted = true;
        this.el.classList.add("muted");

        this.gainRangeEl.value = 0;
        this.applyGain();
      }

      unmute() {
        if (this.gainValue === 0) {
          this.gainValue = DEFAULT_GAIN_VALUE;
        }

        this.muteButton.innerHTML = "<span>mute</span>";
        this.muteButton.classList.remove("active");

        this.isMuted = false;
        this.el.classList.remove("muted");

        this.gainRangeEl.value = this.gainValue;
        this.applyGain();
      }

      clear() {
        this.unmute();
        if (this.isSoloed) {
          this.setSolo(false);
        }

        if (this.state === 1 && this.recorder) {
          this.recorder.onBufferReady = () => { };
          this.recorder.stopRecording();
        }
        this.stopVideoCapture();
        this.videoCapture = null;
        this.videoFrames = null;
        this.updateVideoToggle();

        this.stopVoice();
        this.state = 0;
        this.sourceSelect.disabled = false;
        this.buffer = null;
        this.loopBuffer = null;
        this.peaks = null;
        this.rawPeaks = null;
        this.trimStart = 0;
        this.trimEnd = 0;
        this.setTrimming(false);
        this.drag = null;
        this.setOffset(0);
        this.el.classList.remove("has-buffer", "is-recording");
        this.gainRangeEl.value = DEFAULT_GAIN_VALUE;

        this.screenStatus.textContent = "status: ready";
        this.screenDuration.textContent = "time: -";
      }

      handleStartStopRecord() {
        if (!this.state) {
          this.state = 1;
          this.sourceSelect.disabled = true;
          this.recorder.onBufferReady = (buffer, startTime) => this.onRecorded(buffer, startTime);
          this.recorder.startRecording();
          if (this.source === "mic") {
            this.videoCapture = camera.startCapture();
          }
          this.el.classList.add("is-recording");
          this.updateVideoToggle();
          this.screenStatus.textContent = `status: recording ${this.source}...`;
        } else if (this.state === 1) {
          this.recorder.stopRecording();
          this.stopVideoCapture();
          this.state = 2;
        } else if (this.state === 2) {
          this.clear();
          this.handleStartStopRecord();
        }
      }

      onRecorded(buffer, startTime) {
        this.el.classList.remove("is-recording");
        this.sourceSelect.disabled = false;
        if (!buffer) {
          this.clear();
          return;
        }

        this.el.classList.add("has-buffer");
        this.screenStatus.textContent = "status: playing";
        this.state = 2;

        this.buffer = buffer;
        this.rawPeaks = computePeaks(buffer);
        this.trimStart = 0;
        this.trimEnd = 0;
        this.anchorTime = startTime - this.recorder.getLatencyCompensation();
        this.takeVideoFrames();
        this.setOffset(0);
        this.play();
      }

      stopVideoCapture() {
        if (this.videoCapture) {
          camera.stopCapture(this.videoCapture);
        }
      }

      // Webcam frames are timestamped in the same clock as what's heard, so a frame's
      // position in the recording is relative to the anchor time, like the audio.
      takeVideoFrames() {
        const capture = this.videoCapture;
        this.videoCapture = null;
        this.videoFrames = null;
        if (capture) {
          camera.stopCapture(capture);
          if (capture.frames.length) {
            this.videoFrames = capture.frames
              .map(({ time, bitmap }) => ({ pos: time - this.anchorTime, bitmap }))
              .sort((a, b) => a.pos - b.pos);
          }
        }
        this.lastVideoFrame = null;
        this.updateVideoToggle();
      }

      setVideoVisible(isVisible) {
        this.isVideoVisible = isVisible;
        this.videoToggle.setAttribute("aria-pressed", String(isVisible));
        this.videoToggle.title = isVisible ? "Hide the video" : "Show the video";
        this.lastVideoFrame = null;
      }

      updateVideoToggle() {
        this.videoToggle.hidden = !this.videoFrames && !(this.videoCapture && camera.video);
      }

      drawVideo() {
        if (this.videoToggle.hidden || !this.isVideoVisible) {
          return;
        }
        const ctx = this.videoCtx;

        // While recording, show what the webcam sees.
        if (this.videoCapture) {
          drawMirroredSquare(ctx, camera.video, camera.video.videoWidth, camera.video.videoHeight);
          this.lastVideoFrame = null;
          return;
        }

        const frame = this.getVideoFrameAt(getHeardTime());
        if (frame && frame !== this.lastVideoFrame) {
          this.lastVideoFrame = frame;
          drawMirroredSquare(ctx, frame.bitmap, VIDEO_SIZE, VIDEO_SIZE);
        }
      }

      // The video frame to show when the audio context time `time` is heard.
      getVideoFrameAt(time) {
        const frames = this.videoFrames;
        if (!frames || !this.loopBuffer) {
          return null;
        }
        const pos = mod(time - this.anchorTime - this.offset, this.loopDuration);
        // Last frame at or before the position (binary search).
        let lo = 0;
        let hi = frames.length - 1;
        while (lo < hi) {
          const mid = (lo + hi + 1) >> 1;
          if (frames[mid].pos <= pos) {
            lo = mid;
          } else {
            hi = mid - 1;
          }
        }
        return frames[lo];
      }

      play() {
        if (!this.buffer || !loop.length) {
          return;
        }

        // Snap the nb of iterations to [1, 2, 4, 8, 16, 32, 64, etc.] so that the track
        // repeats at a regular interval.
        this.iterations = 1;
        if (this.playEntireBufferBeforeRepeat) {
          const nbOfLoopIterations = Math.max(1, Math.round(this.buffer.length / loop.length));
          this.iterations = Math.pow(2, Math.round(Math.log2(nbOfLoopIterations)));
        }

        // Using an exact multiple of the loop's length, in frames, means the
        // tracks can never drift apart.
        const loopLength = this.iterations * loop.length;
        this.loopBuffer = foldBuffer(trimBuffer(this.buffer, this.trimStart, this.trimEnd), loopLength);
        this.loopDuration = loopLength / audioContext.sampleRate;
        this.peaks = computePeaks(this.loopBuffer);
        this.setOffset(this.offset);

        this.screenDuration.textContent = `time: ${formatTime(this.loopDuration)} s (${this.iterations} ⨉ loop)`;

        this.restartVoice();
      }

      // (Re)start the looping buffer at the position it should currently be at.
      restartVoice() {
        if (!this.loopBuffer) {
          return;
        }

        const when = audioContext.currentTime + SCHEDULE_AHEAD;
        const position = mod(when - this.anchorTime - this.offset, this.loopDuration);

        const source = audioContext.createBufferSource();
        source.buffer = this.loopBuffer;
        source.loop = true;

        const gain = audioContext.createGain();
        gain.gain.setValueAtTime(0, when);
        gain.gain.linearRampToValueAtTime(1, when + CROSSFADE);

        source.connect(gain);
        gain.connect(this.outputGain);
        source.start(when, position);

        this.stopVoice(when);
        this.voice = { source, gain };
      }

      stopVoice(when = audioContext.currentTime) {
        if (!this.voice) {
          return;
        }

        const { source, gain } = this.voice;
        gain.gain.cancelScheduledValues(when);
        gain.gain.setValueAtTime(1, when);
        gain.gain.linearRampToValueAtTime(0, when + CROSSFADE);
        source.stop(when + CROSSFADE);
        source.onended = () => gain.disconnect();
        this.voice = null;
      }

      setOffset(value) {
        const d = this.loopDuration;
        // Keep the offset within half a loop on either side, it's circular anyway.
        this.offset = d ? mod(value + d / 2, d) - d / 2 : 0;
        this.updateScreenInfo();
      }

      nudge(delta) {
        if (!this.loopBuffer) {
          return;
        }
        this.setOffset(this.offset + delta);
        this.restartVoice();
      }

      // Shows the whole raw recording, with the trimmed parts dimmed.
      drawTrimView(ctx, w, h, dpr) {
        const d = this.buffer.duration;

        // Where the recording wraps around when looping.
        ctx.fillStyle = "#fff6";
        for (let t = this.loopDuration; t < d; t += this.loopDuration) {
          ctx.fillRect(Math.round(t / d * w), 0, 1, h);
        }

        drawPeaks(ctx, this.rawPeaks, w, h, 0, 1, "#d25802cc");

        const startX = Math.round(this.trimStart / d * w);
        const endX = Math.round((d - this.trimEnd) / d * w);
        ctx.fillStyle = "#000c";
        ctx.fillRect(0, 0, startX, h);
        ctx.fillRect(endX, 0, w - endX, h);

        const lineWidth = Math.max(1, Math.round(dpr));
        const tab = Math.round(6 * dpr);
        const focused = document.activeElement === this.waveformEl;
        for (const [handle, x, dir] of [["start", startX, 1], ["end", endX, -1]]) {
          const active = focused && this.activeTrimHandle === handle;
          ctx.fillStyle = active ? "#ff9a4d" : "#fff";
          const lineX = dir === 1 ? x : x - lineWidth;
          ctx.fillRect(lineX, 0, lineWidth, h);
          ctx.fillRect(dir === 1 ? x : x - tab, 0, tab, tab);
          ctx.fillRect(dir === 1 ? x : x - tab, h - tab, tab, tab);
        }
      }

      draw() {
        this.drawVideo();

        const canvas = this.waveformEl;
        const dpr = window.devicePixelRatio || 1;
        const w = Math.round(canvas.clientWidth * dpr);
        const h = Math.round(canvas.clientHeight * dpr);
        if (!w || !h) {
          return;
        }
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }

        const ctx = this.canvasCtx;
        ctx.clearRect(0, 0, w, h);

        if (!loop.length) {
          ctx.fillStyle = "#fff2";
          ctx.fillRect(0, Math.floor(h / 2), w, 1);
          return;
        }

        if (this.isTrimming && this.rawPeaks) {
          this.drawTrimView(ctx, w, h, dpr);
          return;
        }

        const duration = this.loopBuffer ? this.loopDuration : getLoopDuration();
        const iterations = this.loopBuffer ? this.iterations : 1;

        // Guides: loop boundaries, and beats.
        const guides = iterations * BEATS_PER_LOOP;
        for (let i = 1; i < guides; i++) {
          ctx.fillStyle = i % BEATS_PER_LOOP === 0 ? "#fff6" : "#fff1";
          ctx.fillRect(Math.round(i / guides * w), 0, 1, h);
        }

        // The other tracks' waveforms, in the background, as a reference.
        for (const other of tracks) {
          if (other === this || !other.peaks) {
            continue;
          }
          const otherShift = mod(other.anchorTime + other.offset - loop.anchor, other.loopDuration);
          drawPeaks(ctx, other.peaks, w, h, -otherShift / other.loopDuration, duration / other.loopDuration, "#ffffff30");
        }

        // This track's waveform, where it's actually heard relative to the loop.
        if (this.peaks) {
          const shift = mod(this.anchorTime + this.offset - loop.anchor, duration) / duration;
          drawPeaks(ctx, this.peaks, w, h, -shift, 1, this.drag ? "#ff9a4dcc" : "#d25802cc");
        }

        // Playhead, at what's currently being heard.
        const latency = (audioContext.outputLatency || 0) + (audioContext.baseLatency || 0);
        const heardTime = audioContext.currentTime - latency;
        const x = mod(heardTime - loop.anchor, duration) / duration * w;
        ctx.fillStyle = "#fff";
        ctx.fillRect(Math.floor(x), 0, Math.max(1, Math.round(dpr)), h);
      }
    }

    let recorderWorkletReady = null;

    function loadRecorderWorklet() {
      if (!recorderWorkletReady) {
        const moduleUrl = URL.createObjectURL(new Blob([RECORDER_WORKLET], { type: "application/javascript" }));
        recorderWorkletReady = audioContext.audioWorklet.addModule(moduleUrl).finally(() => URL.revokeObjectURL(moduleUrl));
        recorderWorkletReady.catch(() => recorderWorkletReady = null);
      }
      return recorderWorkletReady;
    }

    // Captures the audio playing on the device (a tab, a window, or the whole system),
    // via screen sharing. Only the audio is kept.
    async function getDeviceAudioStream() {
      const stream = await navigator.mediaDevices.getDisplayMedia({
        video: true,
        audio: {
          echoCancellation: false,
          autoGainControl: false,
          noiseSuppression: false,
          // Keep hearing the captured tab.
          suppressLocalAudioPlayback: false,
          // Don't record the looper's own output when capturing system audio.
          restrictOwnAudio: true
        },
        systemAudio: "include",
        windowAudio: "system",
        selfBrowserSurface: "exclude",
        preferCurrentTab: false,
        surfaceSwitching: "include"
      });

      stream.getVideoTracks().forEach(track => track.stop());

      if (!stream.getAudioTracks().length) {
        stream.getTracks().forEach(track => track.stop());
        const error = new Error("No audio was shared");
        error.name = "NoAudioError";
        throw error;
      }
      return stream;
    }

    function showCaptureError(e) {
      if (e.name === "NotAllowedError" || e.name === "AbortError") {
        // The user cancelled the prompt.
        return;
      }
      if (e.name === "NoAudioError") {
        alert("No audio was shared. Pick a tab and turn on \"Also share tab audio\", or pick the entire screen and turn on \"Also share system audio\".");
        return;
      }
      alert(`Could not capture audio: ${e.message}`);
    }

    const recorderPromises = { mic: null, device: null };

    // Returns the recorder for `kind` ("mic" or "device"), asking for access if needed.
    function getRecorder(kind) {
      if (!recorderPromises[kind]) {
        const recorder = new Recorder(kind);
        const promise = recorder.setup().then(() => recorder, e => {
          recorderPromises[kind] = null;
          throw e;
        });
        // When the user stops sharing, ask again next time.
        recorder.onEnded = () => {
          if (recorderPromises[kind] === promise) {
            recorderPromises[kind] = null;
          }
        };
        recorderPromises[kind] = promise;
      }
      return recorderPromises[kind];
    }

    class Recorder {
      constructor(kind) {
        this.kind = kind;
        this.stream = null;
        this.node = null;
        this.isRecording = false;
        this.chunks = [];
        this.startFrame = null;
        this.stopTime = 0;
        this.inputLatency = 0;
      }

      async setup() {
        this.stream = this.kind === "device"
          ? await getDeviceAudioStream()
          : await navigator.mediaDevices.getUserMedia({
            video: false,
            audio: {
              echoCancellation: false,
              autoGainControl: false,
              noiseSuppression: false,
              latency: 0
            }
          });

        const audioTrack = this.stream.getAudioTracks()[0];
        this.inputLatency = audioTrack.getSettings().latency || 0;
        audioTrack.addEventListener("ended", () => {
          this.stopRecording();
          if (this.source) {
            this.source.disconnect();
          }
          this.onEnded();
        });

        await loadRecorderWorklet();

        this.source = audioContext.createMediaStreamSource(this.stream);
        this.node = new AudioWorkletNode(audioContext, "recorder");
        // The worklet needs to be connected to the destination to get processed,
        // but we don't want to hear the input.
        const silence = audioContext.createGain();
        silence.gain.value = 0;
        this.source.connect(this.node);
        this.node.connect(silence);
        silence.connect(audioContext.destination);

        this.node.port.onmessage = e => {
          if (e.data.type === "data") {
            if (this.startFrame === null) {
              this.startFrame = e.data.frame;
            }
            this.chunks.push(e.data.data);
          } else if (e.data.type === "stop") {
            this.onStopped();
          }
        };
      }

      // How much earlier than its capture time a recording should be played.
      getLatencyCompensation() {
        if (this.kind === "device") {
          // Device audio is captured as it's sent to the speakers, just like the loop,
          // so only the capture latency matters.
          return this.inputLatency;
        }
        // The user played along with what they heard, which came out of the speakers late.
        return (audioContext.outputLatency || 0) + (audioContext.baseLatency || 0) + this.inputLatency;
      }

      // Override this to know when the input stops being available.
      onEnded() { }

      // Call this to start recording.
      startRecording() {
        if (this.isRecording) {
          return;
        }

        this.chunks = [];
        this.startFrame = null;
        this.isRecording = true;
        this.node.port.postMessage("start");
      }

      // Call this to stop recording. Resolves once the recording is processed.
      stopRecording() {
        if (!this.isRecording) {
          return this.stopped || Promise.resolve();
        }

        this.isRecording = false;
        this.stopTime = audioContext.currentTime;
        this.stopped = new Promise(resolve => this.resolveStopped = resolve);
        this.node.port.postMessage("stop");
        return this.stopped;
      }

      onStopped() {
        try {
          this.processRecording();
        } finally {
          this.resolveStopped();
        }
      }

      processRecording() {
        const sampleRate = audioContext.sampleRate;
        const startTime = this.startFrame === null ? 0 : this.startFrame / sampleRate;
        const totalLength = this.chunks.reduce((sum, chunk) => sum + chunk.length, 0);
        // Trim the frames that were recorded after the stop button was pressed.
        const wantedLength = Math.round((this.stopTime - startTime) * sampleRate);
        const length = Math.min(totalLength, Math.max(0, wantedLength));

        if (!length) {
          this.onBufferReady(null, 0);
          return;
        }

        const buffer = audioContext.createBuffer(1, length, sampleRate);
        const data = buffer.getChannelData(0);
        let pos = 0;
        for (const chunk of this.chunks) {
          if (pos >= length) {
            break;
          }
          data.set(chunk.subarray(0, length - pos), pos);
          pos += chunk.length;
        }
        this.chunks = [];

        this.onBufferReady(buffer, startTime);
      }

      // Override this to get the newly recorded buffer, and the audio context
      // time of its first frame.
      onBufferReady() { }
    }

    function clearAll() {
      tracks.forEach(track => {
        track.unmute();
        track.clear();
      });
    }

    function addTrack() {
      const track = new Track(tracksEl, { name: String(++trackCount) });
      tracks.push(track);
    }

    // Adds a copy of `source` right after it.
    function duplicateTrack(source) {
      const track = new Track(tracksEl, {
        name: String(++trackCount),
        after: source.el
      });
      tracks.splice(tracks.indexOf(source) + 1, 0, track);
      track.copyFrom(source);
    }

    function deleteTrack(track) {
      track.clear();
      track.outputGain.disconnect();
      track.el.remove();
      tracks = tracks.filter(t => t !== track);
      refreshGroupCounts();
      applyAllGains();
    }

    // Whether any track is soloed, directly or via its group.
    function isAnythingSoloed() {
      return tracks.some(track => track.isSoloed || (track.group && track.group.isSoloed));
    }

    function applyAllGains() {
      tracks.forEach(track => track.applyGain());
    }

    function addGroup() {
      const group = { id: nextGroupId++, isMuted: false, isSoloed: false };

      group.el = document.createElement("section");
      group.el.classList.add("group");

      const header = document.createElement("header");
      header.classList.add("group-header");

      const led = document.createElement("span");
      led.classList.add("led");

      group.nameInput = document.createElement("input");
      group.nameInput.type = "text";
      group.nameInput.classList.add("group-name");
      group.nameInput.maxLength = 20;
      group.nameInput.spellcheck = false;
      group.nameInput.value = `group ${group.id}`;
      group.nameInput.setAttribute("aria-label", "Group name");

      group.countEl = document.createElement("span");
      group.countEl.classList.add("group-count");

      group.muteButton = document.createElement("button");
      group.muteButton.classList.add("small");
      group.muteButton.title = "Mute or unmute all the tracks of this group";
      group.muteButton.innerHTML = "<span>mute</span>";

      group.soloButton = document.createElement("button");
      group.soloButton.classList.add("small", "solo");
      group.soloButton.title = "Solo: only hear the tracks of this group (and the other soloed tracks)";
      group.soloButton.innerHTML = "<span>solo</span>";

      const removeButton = document.createElement("button");
      removeButton.classList.add("small", "danger");
      removeButton.title = "Delete this group (its tracks are kept)";
      removeButton.innerHTML = "<span>del</span>";

      header.append(led, group.nameInput, group.countEl, group.muteButton, group.soloButton, removeButton);

      group.tracksEl = document.createElement("div");
      group.tracksEl.classList.add("group-tracks");

      group.el.append(header, group.tracksEl);
      tracksEl.insertBefore(group.el, tracksActions);

      const updateLabel = () => group.el.setAttribute("aria-label", `Group: ${group.nameInput.value}`);
      updateLabel();
      group.nameInput.addEventListener("input", () => {
        updateLabel();
        refreshGroupOptions();
      });
      group.nameInput.addEventListener("change", () => {
        group.nameInput.value = group.nameInput.value.trim() || `group ${group.id}`;
        updateLabel();
        refreshGroupOptions();
      });
      group.muteButton.addEventListener("click", () => setGroupMuted(group, !group.isMuted));
      group.soloButton.addEventListener("click", () => setGroupSoloed(group, !group.isSoloed));
      removeButton.addEventListener("click", () => removeGroup(group));

      groups.push(group);
      refreshGroupOptions();
      group.nameInput.focus();
      group.nameInput.select();
      return group;
    }

    function setGroupMuted(group, isMuted) {
      group.isMuted = isMuted;
      group.muteButton.classList.toggle("active", isMuted);
      group.el.classList.toggle("is-muted", isMuted);
      tracks.filter(track => track.group === group).forEach(track => track.applyGain());
    }

    function setGroupSoloed(group, isSoloed) {
      group.isSoloed = isSoloed;
      group.soloButton.classList.toggle("active", isSoloed);
      // A soloed group is meant to be heard.
      if (isSoloed && group.isMuted) {
        setGroupMuted(group, false);
      }
      applyAllGains();
    }

    // Deletes the group, and puts its tracks where the group was.
    function removeGroup(group) {
      groups = groups.filter(g => g !== group);
      for (const el of [...group.tracksEl.children]) {
        moveNode(tracksEl, el, group.el);
      }
      group.el.remove();
      tracks.filter(track => track.group === group).forEach(track => track.setGroup(null, { move: false }));
      refreshGroupOptions();
    }

    function refreshGroupOptions() {
      tracks.forEach(track => track.renderGroupOptions());
      refreshGroupCounts();
    }

    function refreshGroupCounts() {
      groups.forEach(group => {
        const count = tracks.filter(track => track.group === group).length;
        group.countEl.textContent = `${count} track${count === 1 ? "" : "s"}`;
      });
    }

    // Moves a node without resetting its state (e.g. focus), when supported.
    function moveNode(parent, node, before) {
      if ("moveBefore" in Element.prototype && node.isConnected && parent.isConnected) {
        parent.moveBefore(node, before);
      } else {
        parent.insertBefore(node, before);
      }
    }

    // Drag a track by its handle to move it in or out of a group, or to reorder tracks.
    function startTrackDrag(track, e) {
      if (e.button !== 0) {
        return;
      }
      e.preventDefault();

      const handle = e.currentTarget;
      handle.setPointerCapture(e.pointerId);
      const startX = e.clientX;
      const startY = e.clientY;
      const listeners = new AbortController();
      let drag = null;

      const end = commit => {
        listeners.abort();
        if (drag) {
          endTrackDrag(drag, commit);
        }
      };

      handle.addEventListener("pointermove", e => {
        if (!drag) {
          // Only start dragging after a small move, so that clicks aren't drags.
          if (Math.hypot(e.clientX - startX, e.clientY - startY) < 4) {
            return;
          }
          drag = beginTrackDrag(track, startX, startY);
        }
        updateTrackDrag(drag, e.clientX, e.clientY);
      }, { signal: listeners.signal });
      handle.addEventListener("pointerup", () => end(true), { signal: listeners.signal });
      handle.addEventListener("pointercancel", () => end(false), { signal: listeners.signal });
      document.addEventListener("keydown", e => {
        if (e.key === "Escape") {
          end(false);
        }
      }, { signal: listeners.signal });
    }

    function beginTrackDrag(track, x, y) {
      const rect = track.el.getBoundingClientRect();
      // The track floats above the page while dragged, and only moves in the DOM on drop.
      Object.assign(track.el.style, {
        width: `${rect.width}px`,
        height: `${rect.height}px`,
        left: `${rect.left}px`,
        top: `${rect.top}px`
      });
      track.el.classList.add("dragging");
      document.body.classList.add("is-dragging");

      const indicator = document.createElement("div");
      indicator.classList.add("drop-indicator");
      return { track, indicator, dx: x - rect.left, dy: y - rect.top };
    }

    function updateTrackDrag(drag, x, y) {
      drag.track.el.style.left = `${x - drag.dx}px`;
      drag.track.el.style.top = `${y - drag.dy}px`;

      const under = document.elementFromPoint(x, y);
      const groupEl = under && under.closest(".group");
      const container = groupEl ? groupEl.querySelector(".group-tracks") : under && under.closest(".tracks");

      groups.forEach(group => group.el.classList.toggle("drop-target", group.el === groupEl));

      if (!container) {
        drag.indicator.remove();
        return;
      }

      // Find the item to drop before, in reading order.
      let before = container === tracksEl ? tracksActions : null;
      const items = [...container.children].filter(item => item !== drag.track.el && item.matches(".track, .group"));
      for (const item of items) {
        const rect = item.getBoundingClientRect();
        if (y < rect.top || (y <= rect.bottom && x < rect.left + rect.width / 2)) {
          before = item;
          break;
        }
      }

      if (drag.indicator.parentElement !== container || drag.indicator.nextElementSibling !== before) {
        container.insertBefore(drag.indicator, before);
      }
    }

    function endTrackDrag(drag, commit) {
      const { track, indicator } = drag;
      track.el.classList.remove("dragging");
      track.el.style.removeProperty("width");
      track.el.style.removeProperty("height");
      track.el.style.removeProperty("left");
      track.el.style.removeProperty("top");
      document.body.classList.remove("is-dragging");
      groups.forEach(group => group.el.classList.remove("drop-target"));

      if (commit && indicator.isConnected) {
        const container = indicator.parentElement;
        moveNode(container, track.el, indicator);
        const group = groups.find(g => g.tracksEl === container) || null;
        track.setGroup(group, { move: false });
      }
      indicator.remove();
    }

    // Size, in pixels, of each video in the downloaded video grid.
    const EXPORT_CELL_SIZE = 256;
    // Extra seconds recorded at the end of the video, see recordVideoMix.
    const EXPORT_TAIL = 0.15;
    const EXPORT_VIDEO_TYPES = [
      "video/mp4;codecs=avc1.42E01F,mp4a.40.2",
      "video/mp4",
      "video/webm;codecs=vp9,opus",
      "video/webm"
    ];

    // Renders one full cycle of all the audible tracks (the length of the longest track)
    // and downloads it. As a WAV file, or as a video with a grid of the tracks' videos
    // if some audible tracks have (visible) videos.
    async function downloadMix() {
      const recorded = tracks.filter(track => track.loopBuffer);
      if (!recorded.length) {
        alert("Record a track first");
        return;
      }

      const length = Math.max(...recorded.map(track => track.loopBuffer.length));
      const offline = new OfflineAudioContext(1, length, audioContext.sampleRate);
      const audible = recorded.filter(track => track.isAudible());

      for (const track of audible) {
        const source = offline.createBufferSource();
        source.buffer = track.loopBuffer;
        source.loop = true;
        const gain = offline.createGain();
        gain.gain.value = track.gainValue;
        source.connect(gain);
        gain.connect(offline.destination);
        // Start the mix where the loop starts, keeping every track's alignment.
        source.start(0, mod(loop.anchor - track.anchorTime - track.offset, track.loopDuration));
      }

      const videoTracks = audible.filter(track => track.videoFrames && track.isVideoVisible);

      downloadButton.disabled = true;
      const label = downloadButton.querySelector("span");
      label.textContent = videoTracks.length ? "saving..." : "save";
      try {
        const rendered = await offline.startRendering();
        const name = `looper-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}`;
        if (videoTracks.length && typeof MediaRecorder !== "undefined") {
          const { blob, extension } = await recordVideoMix(rendered, videoTracks);
          downloadBlob(blob, `${name}.${extension}`);
        } else {
          downloadBlob(encodeWav(rendered), `${name}.wav`);
        }
      } finally {
        downloadButton.disabled = false;
        label.textContent = "save";
      }
    }

    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // Plays the rendered mix while drawing the videos in a grid on a canvas, and records
    // both. This happens in real time, so it takes as long as the mix.
    async function recordVideoMix(rendered, videoTracks) {
      const cols = Math.ceil(Math.sqrt(videoTracks.length));
      const rows = Math.ceil(videoTracks.length / cols);
      const canvas = document.createElement("canvas");
      canvas.width = cols * EXPORT_CELL_SIZE;
      canvas.height = rows * EXPORT_CELL_SIZE;
      const ctx = canvas.getContext("2d");

      // The mix plays in its own context, so it works even when the looper is paused,
      // and isn't heard.
      const exportContext = new AudioContext({ sampleRate: rendered.sampleRate });
      await exportContext.resume();
      const destination = exportContext.createMediaStreamDestination();
      const source = exportContext.createBufferSource();
      source.buffer = rendered;
      source.connect(destination);

      // Draws what's seen at `mixTime` seconds into the mix.
      const drawGrid = mixTime => {
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        videoTracks.forEach((track, i) => {
          const x = (i % cols) * EXPORT_CELL_SIZE;
          const y = Math.floor(i / cols) * EXPORT_CELL_SIZE;
          const frame = track.getVideoFrameAt(loop.anchor + mixTime);
          if (frame) {
            drawMirroredSquare(ctx, frame.bitmap, VIDEO_SIZE, VIDEO_SIZE, x, y, EXPORT_CELL_SIZE);
          }
          ctx.font = "14px monospace";
          ctx.textBaseline = "bottom";
          ctx.fillStyle = "rgb(0 0 0 / .6)";
          const text = track.nameInput.value;
          ctx.fillRect(x, y + EXPORT_CELL_SIZE - 22, ctx.measureText(text).width + 12, 22);
          ctx.fillStyle = "#fff";
          ctx.fillText(text, x + 6, y + EXPORT_CELL_SIZE - 5);
        });
      };
      drawGrid(0);

      const stream = new MediaStream([
        ...canvas.captureStream(30).getVideoTracks(),
        ...destination.stream.getAudioTracks()
      ]);
      const mimeType = EXPORT_VIDEO_TYPES.find(type => MediaRecorder.isTypeSupported(type)) || "";
      const recorder = new MediaRecorder(stream, {
        mimeType,
        videoBitsPerSecond: 4_000_000,
        audioBitsPerSecond: 192_000
      });
      const chunks = [];
      recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
      const stopped = new Promise(resolve => recorder.onstop = resolve);

      recorder.start();
      const startTime = exportContext.currentTime;
      source.loop = true;
      source.start(startTime);

      let rafId;
      const draw = () => {
        drawGrid(mod(exportContext.currentTime - startTime, rendered.duration));
        rafId = requestAnimationFrame(draw);
      };
      draw();

      // The end of the audio is still in the pipeline when the mix ends, so keep going
      // a bit longer to avoid cutting it.
      const endTime = startTime + rendered.duration + EXPORT_TAIL;
      await new Promise(resolve => {
        const check = () => exportContext.currentTime >= endTime ? resolve() : setTimeout(check, 10);
        check();
      });
      cancelAnimationFrame(rafId);
      recorder.stop();
      source.stop();
      await stopped;
      stream.getTracks().forEach(track => track.stop());
      exportContext.close();

      const type = recorder.mimeType || mimeType || "video/webm";
      return {
        blob: new Blob(chunks, { type }),
        extension: type.startsWith("video/mp4") ? "mp4" : "webm"
      };
    }

    function drawLoop() {
      tracks.forEach(track => track.draw());
      requestAnimationFrame(drawLoop);
    }

    async function start() {
      clearAll();
      tracks.forEach(track => {
        track.outputGain.disconnect();
        track.el.remove();
      });
      tracks = [];
      trackCount = 0;
      groups.forEach(group => group.el.remove());
      groups = [];

      // Create the audio context.
      if (!audioContext) {
        audioContext = new AudioContext({ latencyHint: "interactive" });
        metronome.output = audioContext.createGain();
        metronome.output.connect(audioContext.destination);
        audioContext.addEventListener("statechange", updatePauseButton);
      }
      await resumePlayback();

      // Ask for the mic upfront, so recording can start instantly.
      await getRecorder("mic");
      // The webcam is optional: mic tracks record video only if it's available.
      getCamera().catch(() => { });
      resetLoop();
      setLoop(DEFAULT_LOOP_LENGTH, audioContext.currentTime + SCHEDULE_AHEAD);

      for (let i = 0; i < initTrackNb; i++) {
        addTrack();
      }

      // Show the main controls.
      loopPanel.hidden = false;
      tracksActions.hidden = false;
      pauseButton.hidden = false;
      clearAllButton.hidden = false;
      downloadButton.hidden = false;

      startLooperButton.innerHTML = "<span>Restart</span>";
      startLooperButton.title = "Restart the looper, removing all tracks and resetting the loop length";
      startLooperButton.classList.add("danger");

      if (!metronome.interval) {
        metronome.interval = setInterval(scheduleClicks, 25);
      }

      if (!isDrawing) {
        isDrawing = true;
        drawLoop();
      }
    }

    // Pausing suspends the whole audio context: every track, and the metronome, freeze
    // where they are, and resume in sync.
    async function togglePause() {
      if (audioContext.state === "running") {
        // Recording can't continue while paused, so keep what was recorded so far.
        const recording = tracks.filter(track => track.state === 1);
        recording.forEach(track => track.handleStartStopRecord());
        await Promise.all(recording.map(track => track.recorder.stopped));
        await audioContext.suspend();
      } else {
        await resumePlayback();
      }
    }

    async function resumePlayback() {
      if (audioContext.state !== "running") {
        await audioContext.resume();
      }
    }

    function updatePauseButton() {
      const isPaused = audioContext.state !== "running";
      pauseButton.classList.toggle("active", isPaused);
      pauseButton.innerHTML = isPaused ? "<span>play</span>" : "<span>pause</span>";
    }

    clearAllButton.addEventListener("click", clearAll);
    pauseButton.addEventListener("click", togglePause);
    addTrackButton.addEventListener("click", addTrack);
    addGroupButton.addEventListener("click", addGroup);
    downloadButton.addEventListener("click", downloadMix);
    startLooperButton.addEventListener('click', start);
    tapButton.addEventListener("click", async () => {
      await resumePlayback();
      tap();
    });
    metronomeButton.addEventListener("click", () => {
      metronome.enabled = !metronome.enabled;
      metronomeButton.classList.toggle("active", metronome.enabled);
    });
    loopLengthInput.addEventListener("change", () => {
      loop.tapStart = null;
      tapButton.classList.remove("active");
      const anchor = loop.length ? loop.anchor : audioContext.currentTime + SCHEDULE_AHEAD;
      setLoop(parseFloat(loopLengthInput.value), anchor);
    });
  </script>
</body>

</html>
