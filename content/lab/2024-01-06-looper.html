<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>looper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --button-size: 4rem;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      text-transform: uppercase;
    }

    .wrapper {
      background: rgb(157, 157, 157);
      background-image: url(https://media.istockphoto.com/id/957053842/vector/noise-pattern-seamless-grunge-texture-white-paper-vector.jpg?s=612x612&w=0&k=20&c=Lw_aDEQiLqsAXkqXp5M710I5wpAQKv2Z8icbzOjVljY=);
      min-height: 100%;
      display: grid;
      grid-template-rows: min-content;
    }

    h1,
    p {
      margin: 0;
    }

    header {
      background: rgba(237, 237, 237, 0.933);
      padding: 1rem;
      box-shadow: 0 0 0.25rem 0.25rem #0000006e;
    }

    header h1 {
      font-weight: normal;
    }

    header a {
      color: rgb(210, 88, 2);
      text-decoration: none;
    }

    header a:hover {
      text-decoration: underline;
    }

    header p {
      margin-block-start: 2rem;
    }

    input,
    button {
      font-family: inherit;
      font-size: inherit;
      text-transform: uppercase;
    }

    #looper {
      min-width: 12rem;
      padding: 1rem;
      background: rgba(132, 132, 132, 0.85);
    }

    .buttons {
      display: grid;
      gap: 1rem;
      grid-auto-flow: column;
      justify-content: center;
      margin-block-end: 1rem;
    }

    button {
      border: 0;
      padding: 0;
      background: black;
      aspect-ratio: 1;
      width: var(--button-size);
      position: relative;
      font-size: .7rem;
      text-align: start;
    }


    button::before {
      content: "";
      position: absolute;
      inset: .1rem;
      background: #333;
      border-radius: .25rem;
      aspect-ratio: 1;
      box-shadow: inset .05rem .05rem .1rem 0 #fffe, inset -.05rem -.05rem .1rem 0 #0009, .25rem .25rem .5rem .1rem #0006;
    }

    button.small,
    button.small::before {
      aspect-ratio: 2;
    }

    button.record::before {
      background-color: #d25802;
    }

    button.clear::before,
    button.danger::before {
      background-color: #7e0000;
    }

    .loop-panel {
      display: flex;
      gap: .5rem;
      justify-content: center;
      align-items: center;
      margin-block-end: 1rem;
    }

    .loop-panel[hidden] {
      display: none;
    }

    .loop-panel .screen {
      background: #171717;
      color: #fff;
      font-size: .6rem;
      padding: .5rem;
      width: 12rem;
      box-sizing: border-box;
      box-shadow: inset .125rem .125rem .1rem 0 #0004;
    }

    .loop-length-field {
      display: flex;
      align-items: baseline;
      gap: .25rem;
      font-size: 1.2rem;
    }

    .loop-length-field input {
      width: 100%;
      background: transparent;
      border: 0;
      border-block-end: 1px solid #fff4;
      color: #ff9a4d;
      font-size: inherit;
      padding: 0;
    }

    .loop-length-field input:focus-visible {
      outline: none;
      border-block-end-color: #d25802;
    }

    .tracks-actions {
      display: grid;
      gap: .5rem;
      align-self: center;
    }

    .tracks-actions[hidden] {
      display: none;
    }

    /* A group is a module, like in a modular synth: a metal faceplate with screws. */
    .group {
      --screw: radial-gradient(circle at 40% 40%, #f4f4f4 0 1.5px, #777 2.5px 3px, #2228 3.5px, transparent 4px);
      display: flex;
      flex-direction: column;
      padding: .25rem 1rem 1rem;
      border-radius: .25rem;
      background:
        var(--screw) left .3rem top .3rem / 10px 10px no-repeat,
        var(--screw) right .3rem top .3rem / 10px 10px no-repeat,
        var(--screw) left .3rem bottom .3rem / 10px 10px no-repeat,
        var(--screw) right .3rem bottom .3rem / 10px 10px no-repeat,
        linear-gradient(#bdbdbd, #9c9c9c);
      box-shadow: inset 0 1px 0 #fff9, inset 0 -1px 0 #0006, .25rem .25rem .75rem #0006;
    }

    .group.drop-target {
      outline: 2px solid #d25802;
      outline-offset: 2px;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding-block: .25rem .5rem;
      margin-block-end: .5rem;
      border-block-end: 2px solid #d25802;
    }

    .group-header .led {
      flex: none;
      width: .5rem;
      height: .5rem;
      border-radius: 50%;
      background: #7dff4d;
      box-shadow: 0 0 .4rem #7dff4d, inset 0 0 1px #0008;
    }

    .group.is-muted .group-header .led {
      background: #263d1e;
      box-shadow: inset 0 0 1px #0008;
    }

    .group-header .group-name {
      flex: 1;
      min-width: 6rem;
      field-sizing: content;
      background: transparent;
      border: 0;
      border-block-end: 1px dashed transparent;
      padding: 0;
      color: #1d1d1d;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-shadow: 0 1px 0 #fff9;
    }

    .group-header .group-name:hover {
      border-block-end-color: #0004;
    }

    .group-header .group-name:focus-visible {
      outline: none;
      border-block-end: 1px solid #d25802;
    }

    .group-header .group-count {
      flex: 1 0 auto;
      font-size: .6rem;
      color: #333;
    }

    .group-header button {
      flex: none;
      width: calc(var(--button-size) * .75);
    }

    .group-tracks {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      justify-content: center;
      align-items: flex-start;
      min-height: 4rem;
    }

    .group-tracks:not(:has(> .track:not(.dragging)))::before {
      content: "drag tracks here";
      display: grid;
      place-items: center;
      width: calc(4 * var(--button-size));
      height: 6rem;
      border: 2px dashed #0004;
      border-radius: .25rem;
      color: #0009;
      font-size: .7rem;
    }

    /* Shows where a dragged track will be dropped, without moving the other tracks around. */
    .drop-indicator {
      align-self: stretch;
      width: 4px;
      min-height: 4rem;
      margin-inline: calc(-.25rem - 2px);
      border-radius: 2px;
      background: #d25802;
      box-shadow: 0 0 .5rem #ff9a4d;
    }

    .track.dragging {
      position: fixed;
      z-index: 10;
      margin: 0;
      pointer-events: none;
      background: #a8a8a8;
      opacity: .9;
      rotate: -1deg;
      box-shadow: 0 1rem 2rem #0008;
    }

    body.is-dragging,
    body.is-dragging * {
      cursor: grabbing !important;
      user-select: none;
    }

    button span {
      color: white;
      position: absolute;
      inset: .25rem .5rem;
      text-shadow: -1px -1px 0 #0000006e;
    }


    button:active::before,
    button.active::before {
      scale: .999;
      transform-origin: center;
      box-shadow: inset .25rem .25rem .5rem #000c, inset .05rem .05rem .1rem 0 #fffe, inset -.05rem -.05rem .1rem 0 #0009, .25rem .25rem .5rem 0rem #0006;
    }

    button:active span,
    button.active span {
      scale: .999;
    }

    .tracks {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      justify-content: center;
      align-items: flex-start;
    }

    .track {
      padding: .125rem;
      display: grid;
      grid-template-columns: repeat(4, var(--button-size));
      grid-template-rows: .75rem repeat(2, var(--button-size)) repeat(4, calc(var(--button-size) / 2));
      grid-template-areas:
        "handle handle handle handle"
        "screen screen screen screen"
        "screen screen screen screen"
        "rec    mute   gain   trim"
        "rec    solo   gain   del"
        "sync   plus  gain   dup"
        "sync minus gain clear";
      justify-items: center;
      background: #eee4;
      box-shadow: inset .125rem .125rem .1rem 0 #0004;
    }

    .track .record {
      grid-area: rec;
    }

    /* Grip used to drag the track around, with a screw at each end. */
    .track .handle {
      --screw: radial-gradient(circle at 40% 40%, #f4f4f4 0 1px, #777 2px 2.5px, transparent 3px);
      grid-area: handle;
      justify-self: stretch;
      cursor: grab;
      touch-action: none;
      background:
        var(--screw) left .125rem center / 8px 8px no-repeat,
        var(--screw) right .125rem center / 8px 8px no-repeat,
        radial-gradient(circle, #0007 1px, transparent 1.5px) center / 4px 4px;
      background-clip: border-box, border-box, content-box;
      padding-inline: calc(50% - 1.5rem);
      box-sizing: border-box;
    }

    .track .handle:hover {
      background-color: #fff2;
    }

    .track .trim {
      grid-area: trim;
    }

    .track .sync {
      grid-area: sync;
    }

    .track .offset-plus {
      grid-area: plus;
    }

    .track .offset-minus {
      grid-area: minus;
    }

    .track .screen {
      grid-area: screen;
      position: relative;
      background: #171717;
      width: 100%;
      background-image: linear-gradient(to bottom, transparent, #171717 50%), linear-gradient(to bottom right, transparent, #fff1 40%, transparent 0);
      color: #ffffff;
      font-size: .6rem;
      padding: .5rem;
      box-sizing: border-box;
      display: grid;
      grid-template-rows: auto auto auto auto auto 1fr;
      min-height: 0;
    }

    .track .screen .track-routing {
      display: flex;
      gap: .5em;
    }

    /* Webcam video, recorded with mic tracks. Click it to hide it. */
    .track .screen .video-toggle {
      position: absolute;
      inset-block-start: .5rem;
      inset-inline-end: .5rem;
      width: 4.25rem;
      aspect-ratio: 1;
      padding: 0;
      background: #000;
      border: 1px solid #fff3;
      border-radius: .125rem;
      cursor: pointer;
      overflow: hidden;
    }

    .track .screen .video-toggle::before {
      content: none;
    }

    .track .screen .video-toggle canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .track .screen .video-toggle[aria-pressed="false"] {
      width: auto;
      aspect-ratio: auto;
      padding: 0 .25rem;
      background: transparent;
      color: #ff9a4d;
      font-size: .6rem;
    }

    .track .screen .video-toggle[aria-pressed="false"] canvas {
      display: none;
    }

    .track .screen .video-toggle .video-label {
      position: static;
      color: inherit;
      text-shadow: none;
    }

    .track .screen .video-toggle[aria-pressed="true"] .video-label {
      display: none;
    }

    .track .screen .video-toggle:focus-visible {
      outline: 1px solid #d25802;
    }

    .track.is-recording .screen .video-toggle {
      border-color: #d25802;
    }

    .track .screen select {
      background: transparent;
      border: 0;
      border-block-end: 1px dashed #fff4;
      color: #ff9a4d;
      font: inherit;
      text-transform: inherit;
      padding: 0;
      min-width: 0;
      cursor: pointer;
    }

    .track .screen select:disabled {
      color: inherit;
      cursor: default;
    }

    .track .screen select:focus-visible {
      outline: none;
      border-block-end: 1px solid #d25802;
    }

    .track .screen option {
      background: #171717;
      color: #fff;
    }

    .track.group-muted .screen,
    .track.solo-silenced .screen {
      opacity: .5;
    }

    .track .solo {
      grid-area: solo;
    }

    button.solo.active::before {
      background-color: #a88a00;
    }

    .track .waveform {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      margin-block-start: .25rem;
      background: #0008;
      border-radius: .125rem;
      touch-action: none;
    }

    .track.has-buffer .waveform {
      cursor: ew-resize;
    }

    .track.has-buffer.trimming .waveform {
      cursor: col-resize;
    }

    .track .waveform:focus-visible {
      outline: 1px solid #d25802;
    }

    .track .mute {
      grid-area: mute;
    }

    .track .clear {
      grid-area: clear;
    }

    .track .gain {
      grid-area: gain;
    }

    .track .duplicate {
      grid-area: dup;
    }

    .track .delete {
      grid-area: del;
    }

    .track .screen .track-name {
      display: flex;
      gap: .5em;
    }

    .track .screen .track-name input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      border-block-end: 1px dashed transparent;
      color: inherit;
      font-size: inherit;
      padding: 0;
    }

    .track .screen .track-name input:hover {
      border-block-end-color: #fff4;
    }

    .track .screen .track-name input:focus-visible {
      outline: none;
      border-block-end: 1px solid #d25802;
    }

    .has-buffer .track-status {
      font-weight: bold;
    }

    .track .gain {
      rotate: -90deg;
      -webkit-appearance: none;
      background: transparent;
      background-image: linear-gradient(to right, #fff4 0 .05rem, #8c8c8c .05rem .2rem, transparent 0);
      background-size: .125rem 50%;
      background-repeat: no-repeat;
      background-position: center;
      place-self: center;
      height: 6rem;
      width: 7rem;
    }

    .track .gain::-webkit-slider-runnable-track {
      background: rgb(34, 29, 29);
      border-radius: 100vw;
      height: .5rem;
      box-shadow: inset -.125rem .125rem .25rem 0 black, -1px 1px .125rem 0 #fffa;
    }

    .track .gain::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 50%;
      background: #8c8c8c;
      box-shadow: inset -.05rem .05rem .1rem 0 #fffe, inset .05rem -.05rem .1rem 0 #0009, -.25rem .25rem .5rem .1rem #0006;
      border: 0;
      translate: 0 -.65rem;
    }

    .track .gain::-moz-range-track {
      background: rgb(34, 29, 29);
      border-radius: 100vw;
      height: .5rem;
      box-shadow: inset -.125rem .125rem .25rem 0 black, -1px 1px .125rem 0 #fffa;
    }

    .track .gain::-moz-range-thumb {
      -webkit-appearance: none;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 50%;
      background: #8c8c8c;
      box-shadow: inset -.05rem .05rem .1rem 0 #fffe, inset .05rem -.05rem .1rem 0 #0009, -.25rem .25rem .5rem .1rem #0006;
      border: 0;
    }

    .track.is-recording .record {
      background-color: rgb(237, 66, 66);
    }

    .track.has-buffer .record {
      background-color: #00ff25;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <header>
      <h1>Looper</h1>
      <a href="https://patrickbrosset.com">Patrick Brosset</a>
      <p>multi-track audio looper</p>
    </header>
    <main id="looper">
      <div class="buttons">
        <button id="start" title="Start the looper"><span>Start</span></button>
        <button id="pause" title="Pause or resume the playback" hidden><span>pause</span></button>
        <button id="clear-all" class="danger" title="Clear all tracks" hidden><span>clear all</span></button>
        <button id="download" title="Download one full cycle of the loop: a video grid if tracks have videos, a WAV file otherwise" hidden><span>save</span></button>
      </div>
      <section class="loop-panel" hidden>
        <div class="screen">
          <label for="loop-length">loop length</label>
          <div class="loop-length-field">
            <input id="loop-length" type="number" min="0.1" max="60" step="0.001" placeholder="-" inputmode="decimal">
            <span>s</span>
          </div>
          <div id="loop-info">tap or type a length</div>
        </div>
        <button id="tap" title="Press once on a beat, and again on the next beat, to set the loop length"><span>tap</span></button>
        <button id="metronome" class="active" title="Play a click on every beat of the loop"><span>click</span></button>
      </section>
      <div class="tracks">
        <div class="tracks-actions" hidden>
          <button id="add-track" title="Add a new track"><span>add</span></button>
          <button id="add-group" title="Add a group, to mute and unmute several tracks together"><span>new group</span></button>
        </div>
      </div>
    </main>
  </div>


  <script>
    function formatTime(time) {
      return Math.round(time * 10) / 10;
    }

    function formatOffset(seconds) {
      const ms = Math.round(seconds * 1000);
      return `${ms > 0 ? "+" : ""}${ms} ms`;
    }

    function mod(a, n) {
      return ((a % n) + n) % n;
    }

    // Make it possible to play and record at the same time on iOS.
    if (navigator.audioSession) {
      navigator.audioSession.type = "play-and-record";
    }

    const startLooperButton = document.querySelector("#start");
    const pauseButton = document.querySelector("#pause");
    const addTrackButton = document.querySelector("#add-track");
    const clearAllButton = document.querySelector("#clear-all");
    const downloadButton = document.querySelector("#download");
    const tracksEl = document.querySelector(".tracks");
    const tracksActions = document.querySelector(".tracks-actions");
    const addGroupButton = document.querySelector("#add-group");
    const loopPanel = document.querySelector(".loop-panel");
    const loopLengthInput = document.querySelector("#loop-length");
    const loopInfo = document.querySelector("#loop-info");
    const tapButton = document.querySelector("#tap");
    const metronomeButton = document.querySelector("#metronome");

    const DEFAULT_GAIN_VALUE = 0.5;
    // Offset nudge steps, in seconds.
    const NUDGE_STEP = 0.01;
    const FINE_NUDGE_STEP = 0.001;
    // Short crossfade used when restarting a track, to avoid clicks.
    const CROSSFADE = 0.015;
    // How far in the future a (re)started track gets scheduled.
    const SCHEDULE_AHEAD = 0.03;
    const WAVEFORM_RESOLUTION = 2048;
    // Fade applied at trim points, to avoid clicks.
    const TRIM_FADE = 0.005;
    // Minimum length of audio kept when trimming.
    const MIN_TRIM_KEEP = 0.05;
    const MIN_LOOP_LENGTH = 0.1;
    const MAX_LOOP_LENGTH = 60;
    // The loop is divided in this many beats, for the metronome and guides.
    const BEATS_PER_LOOP = 4;

    // Records mic input inside the audio graph, so that we know the exact
    // audio context time of every recorded sample.
    const RECORDER_WORKLET = `
      class RecorderProcessor extends AudioWorkletProcessor {
        constructor() {
          super();
          this.recording = false;
          this.port.onmessage = e => {
            if (e.data === "start") {
              this.recording = true;
            } else if (e.data === "stop") {
              this.recording = false;
              this.port.postMessage({ type: "stop" });
            }
          };
        }

        process(inputs) {
          if (!this.recording) {
            return true;
          }

          const channels = inputs[0];
          const mono = new Float32Array(channels.length ? channels[0].length : 128);
          for (const channel of channels) {
            for (let i = 0; i < channel.length; i++) {
              mono[i] += channel[i] / channels.length;
            }
          }
          this.port.postMessage({ type: "data", frame: currentFrame, data: mono }, [mono.buffer]);
          return true;
        }
      }
      registerProcessor("recorder", RecorderProcessor);
    `;

    let audioContext = null;
    let tracks = [];
    // Number of tracks created so far, used to name new tracks.
    let trackCount = 0;
    const initTrackNb = 1;
    // Loop length, in seconds, when the looper starts.
    const DEFAULT_LOOP_LENGTH = 1;
    let isDrawing = false;
    // Groups of tracks that can be muted together: { id, name input, isMuted, ... }.
    let groups = [];
    let nextGroupId = 1;

    // The loop every track is synced to. `length` is in frames (0 when not set yet),
    // `anchor` is the audio context time at which a loop starts.
    const loop = { length: 0, anchor: 0, tapStart: null };
    const metronome = { enabled: true, nextBeat: null, output: null, interval: null };

    function getLoopDuration() {
      return loop.length / audioContext.sampleRate;
    }

    function setLoop(seconds, anchor) {
      if (!(seconds >= MIN_LOOP_LENGTH && seconds <= MAX_LOOP_LENGTH)) {
        updateLoopInfo();
        return;
      }

      loop.length = Math.round(seconds * audioContext.sampleRate);
      loop.anchor = anchor;
      metronome.nextBeat = null;
      updateLoopInfo();
      tracks.forEach(track => track.play());
    }

    function resetLoop() {
      loop.length = 0;
      loop.anchor = 0;
      loop.tapStart = null;
      metronome.nextBeat = null;
      tapButton.classList.remove("active");
      updateLoopInfo();
    }

    // Size, in pixels, of the recorded webcam frames.
    const VIDEO_SIZE = 128;

    // The webcam, recorded along with the mic. `captures` are the recordings in progress.
    const camera = {
      video: null,
      promise: null,
      captures: new Set(),

      startCapture() {
        if (!this.video) {
          return null;
        }
        const capture = { frames: [] };
        this.captures.add(capture);
        return capture;
      },

      stopCapture(capture) {
        this.captures.delete(capture);
      }
    };

    function getCamera() {
      if (!camera.promise) {
        camera.promise = (async () => {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }
          });
          const video = document.createElement("video");
          video.muted = true;
          video.playsInline = true;
          video.srcObject = stream;
          await video.play();

          stream.getVideoTracks()[0].addEventListener("ended", () => {
            camera.video = null;
            camera.promise = null;
            camera.captures.clear();
          });

          const onFrame = (now, metadata) => {
            if (camera.video !== video) {
              return;
            }
            captureVideoFrame(video, metadata);
            video.requestVideoFrameCallback(onFrame);
          };
          video.requestVideoFrameCallback(onFrame);
          camera.video = video;
        })();
        camera.promise.catch(() => camera.promise = null);
      }
      return camera.promise;
    }

    function captureVideoFrame(video, metadata) {
      if (!camera.captures.size || !video.videoWidth) {
        return;
      }
      // When the camera captured the frame, if known.
      const time = perfToHeardTime(metadata.captureTime ?? metadata.presentationTime ?? performance.now());
      const captures = [...camera.captures];
      const w = video.videoWidth;
      const h = video.videoHeight;
      const size = Math.min(w, h);
      createImageBitmap(video, (w - size) / 2, (h - size) / 2, size, size, {
        resizeWidth: VIDEO_SIZE,
        resizeHeight: VIDEO_SIZE,
        resizeQuality: "medium"
      }).then(bitmap => captures.forEach(capture => capture.frames.push({ time, bitmap })));
    }

    // Draws the center square of `source`, mirrored like a selfie.
    function drawMirroredSquare(ctx, source, w, h, dx = 0, dy = 0, dSize = VIDEO_SIZE) {
      if (!w || !h) {
        return;
      }
      const size = Math.min(w, h);
      ctx.save();
      ctx.setTransform(-1, 0, 0, 1, dx + dSize, dy);
      ctx.drawImage(source, (w - size) / 2, (h - size) / 2, size, size, 0, 0, dSize, dSize);
      ctx.restore();
    }

    // The audio context time of what's coming out of the speakers right now.
    function getHeardTime() {
      return perfToHeardTime(performance.now());
    }

    // Converts a performance.now() time to the audio context time that was (or will be)
    // heard at that moment.
    function perfToHeardTime(perfTime) {
      const ts = audioContext.getOutputTimestamp();
      if (audioContext.state !== "running" || !ts.performanceTime) {
        const latency = (audioContext.outputLatency || 0) + (audioContext.baseLatency || 0);
        return audioContext.currentTime - latency;
      }
      return ts.contextTime + (perfTime - ts.performanceTime) / 1000;
    }

    function updateLoopInfo() {
      if (loop.tapStart !== null) {
        loopInfo.textContent = "tap again on the next beat";
        return;
      }
      if (!loop.length) {
        loopLengthInput.value = "";
        loopInfo.textContent = "tap or type a length";
        return;
      }
      const duration = getLoopDuration();
      loopLengthInput.value = Math.round(duration * 1000) / 1000;
      loopInfo.textContent = `${Math.round(60 / (duration / BEATS_PER_LOOP) * 10) / 10} bpm (${BEATS_PER_LOOP} beats)`;
    }

    function tap() {
      const now = audioContext.currentTime;
      if (loop.tapStart === null) {
        loop.tapStart = now;
        tapButton.classList.add("active");
        updateLoopInfo();
        return;
      }

      const start = loop.tapStart;
      loop.tapStart = null;
      tapButton.classList.remove("active");
      // The loop starts on the first tap.
      setLoop(now - start, start);
    }

    function playClick(time, accent) {
      const osc = audioContext.createOscillator();
      osc.frequency.value = accent ? 1600 : 1000;
      const gain = audioContext.createGain();
      gain.gain.setValueAtTime(accent ? 0.5 : 0.25, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
      osc.connect(gain);
      gain.connect(metronome.output);
      osc.start(time);
      osc.stop(time + 0.05);
      osc.onended = () => gain.disconnect();
    }

    // Schedules the metronome clicks a little bit ahead of time.
    function scheduleClicks() {
      if (!loop.length || !metronome.enabled) {
        metronome.nextBeat = null;
        return;
      }

      const beat = getLoopDuration() / BEATS_PER_LOOP;
      const now = audioContext.currentTime;
      if (metronome.nextBeat === null) {
        metronome.nextBeat = Math.ceil((now + SCHEDULE_AHEAD - loop.anchor) / beat);
      }
      while (loop.anchor + metronome.nextBeat * beat < now + 0.2) {
        const time = loop.anchor + metronome.nextBeat * beat;
        if (time >= now) {
          playClick(time, mod(metronome.nextBeat, BEATS_PER_LOOP) === 0);
        }
        metronome.nextBeat++;
      }
    }

    // Returns a buffer of exactly `length` frames, where the recorded audio that
    // goes beyond `length` wraps around to the start (like overlapping loops would).
    function foldBuffer(buffer, length) {
      const out = audioContext.createBuffer(buffer.numberOfChannels, length, buffer.sampleRate);
      for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
        const src = buffer.getChannelData(ch);
        const dst = out.getChannelData(ch);
        for (let i = 0; i < src.length; i++) {
          dst[i % length] += src[i];
        }
      }
      return out;
    }

    // Returns a copy of `buffer` where the first `start` and last `end` seconds are silenced.
    function trimBuffer(buffer, start, end) {
      if (!start && !end) {
        return buffer;
      }

      const sampleRate = buffer.sampleRate;
      const length = buffer.length;
      const startFrame = Math.round(start * sampleRate);
      const endFrame = length - Math.round(end * sampleRate);
      const fade = Math.round(TRIM_FADE * sampleRate);
      const out = audioContext.createBuffer(buffer.numberOfChannels, length, sampleRate);

      for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
        const src = buffer.getChannelData(ch);
        const dst = out.getChannelData(ch);
        for (let i = startFrame; i < endFrame; i++) {
          let g = 1;
          if (start && i < startFrame + fade) {
            g = (i - startFrame) / fade;
          }
          if (end && i >= endFrame - fade) {
            g = Math.min(g, (endFrame - i) / fade);
          }
          dst[i] = src[i] * g;
        }
      }
      return out;
    }

    function encodeWav(buffer) {
      const channels = buffer.numberOfChannels;
      const length = buffer.length;
      const data = [];
      let peak = 0;
      for (let ch = 0; ch < channels; ch++) {
        const channelData = buffer.getChannelData(ch);
        data.push(channelData);
        for (let i = 0; i < length; i++) {
          peak = Math.max(peak, Math.abs(channelData[i]));
        }
      }
      // Avoid clipping if the mix got too loud.
      const scale = peak > 1 ? 0.99 / peak : 1;

      const view = new DataView(new ArrayBuffer(44 + length * channels * 2));
      const writeString = (offset, str) => [...str].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
      writeString(0, "RIFF");
      view.setUint32(4, 36 + length * channels * 2, true);
      writeString(8, "WAVE");
      writeString(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, channels, true);
      view.setUint32(24, buffer.sampleRate, true);
      view.setUint32(28, buffer.sampleRate * channels * 2, true);
      view.setUint16(32, channels * 2, true);
      view.setUint16(34, 16, true);
      writeString(36, "data");
      view.setUint32(40, length * channels * 2, true);

      let offset = 44;
      for (let i = 0; i < length; i++) {
        for (let ch = 0; ch < channels; ch++) {
          const sample = Math.max(-1, Math.min(1, data[ch][i] * scale));
          view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
          offset += 2;
        }
      }
      return new Blob([view], { type: "audio/wav" });
    }

    function computePeaks(buffer) {
      const data = buffer.getChannelData(0);
      const peaks = new Float32Array(WAVEFORM_RESOLUTION);
      const blockSize = data.length / WAVEFORM_RESOLUTION;
      let max = 0;
      for (let i = 0; i < WAVEFORM_RESOLUTION; i++) {
        const end = Math.min(data.length, Math.floor((i + 1) * blockSize));
        let peak = 0;
        for (let j = Math.floor(i * blockSize); j < end; j++) {
          peak = Math.max(peak, Math.abs(data[j]));
        }
        peaks[i] = peak;
        max = Math.max(max, peak);
      }
      if (max > 0) {
        for (let i = 0; i < peaks.length; i++) {
          peaks[i] /= max;
        }
      }
      return peaks;
    }

    // Draws `peaks` across the canvas. Column x shows the peaks found at
    // fraction (start + x / w * scale) of the buffer, wrapping around.
    function drawPeaks(ctx, peaks, w, h, start, scale, color) {
      const n = peaks.length;
      ctx.fillStyle = color;
      for (let x = 0; x < w; x++) {
        const from = Math.floor((start + x / w * scale) * n);
        const to = Math.max(from + 1, Math.floor((start + (x + 1) / w * scale) * n));
        let peak = 0;
        for (let i = from; i < to; i++) {
          peak = Math.max(peak, peaks[mod(i, n)]);
        }
        const barHeight = Math.max(1, peak * h * 0.9);
        ctx.fillRect(x, (h - barHeight) / 2, 1, barHeight);
      }
    }

    class Track {
      constructor(parentEl, { name, after } = {}) {
        this.parentEl = parentEl;
        // Where the track records from: "mic" or "device".
        this.source = "mic";
        this.recorder = null;
        this.group = null;
        this.isPreparing = false;

        this.createDom();
        this.defaultName = name;
        this.nameInput.value = name;
        this.renderGroupOptions();

        if (after) {
          after.after(this.el);
        } else {
          this.parentEl.insertBefore(this.el, tracksActions);
        }

        // The raw recorded buffer.
        this.buffer = null;
        // The buffer actually looped, its length is a multiple of the loop's.
        this.loopBuffer = null;
        this.loopDuration = 0;
        this.iterations = 1;
        this.peaks = null;
        // Peaks of the raw recording, shown when trimming.
        this.rawPeaks = null;
        // Seconds silenced at the start and end of the raw recording.
        this.trimStart = 0;
        this.trimEnd = 0;
        this.isTrimming = false;
        this.activeTrimHandle = "start";
        this.state = 0;
        this.isMuted = false;
        this.isSoloed = false;
        // Webcam frames recorded along with the mic: [{ pos, bitmap }], pos being the
        // position in the recording, in seconds.
        this.videoFrames = null;
        this.videoCapture = null;
        this.isVideoVisible = true;
        this.lastVideoFrame = null;
        this.gainValue = DEFAULT_GAIN_VALUE;
        this.playEntireBufferBeforeRepeat = true;
        // Audio context time at which the first sample of the buffer was played
        // (or should have been played, to be in sync with what was heard).
        this.anchorTime = 0;
        // User adjustment, in seconds, on top of the anchor time.
        this.offset = 0;
        this.voice = null;
        this.drag = null;
        this.lastLiveRestart = 0;

        this.outputGain = audioContext.createGain();
        this.outputGain.gain.value = this.gainValue;
        this.outputGain.connect(audioContext.destination);

        this.muteButton.addEventListener("click", () => {
          this.toggleMute();
        });

        this.soloButton.addEventListener("click", () => {
          this.setSolo(!this.isSoloed);
        });

        this.videoToggle.addEventListener("click", () => {
          this.setVideoVisible(!this.isVideoVisible);
        });
        this.setVideoVisible(true);

        this.clearButton.addEventListener("click", () => {
          this.clear();
        });

        this.duplicateButton.addEventListener("click", () => {
          duplicateTrack(this);
        });

        this.deleteButton.addEventListener("click", () => {
          deleteTrack(this);
        });

        this.nameInput.addEventListener("change", () => {
          this.nameInput.value = this.nameInput.value.trim() || this.defaultName;
        });

        this.recordButton.addEventListener("click", async () => {
          if (!loop.length) {
            alert("Set the loop length first: tap it, or type it in seconds");
            return;
          }
          if (this.isPreparing) {
            return;
          }

          // Starting a new recording: get the recorder for the selected input.
          if (this.state !== 1) {
            this.isPreparing = true;
            try {
              await resumePlayback();
              this.recorder = await getRecorder(this.source);
            } catch (e) {
              showCaptureError(e);
              return;
            } finally {
              this.isPreparing = false;
            }
            if (this.recorder.isRecording) {
              alert(`Another track is already recording from the ${this.source}`);
              return;
            }
          }

          this.handleStartStopRecord();
        });

        this.sourceSelect.addEventListener("change", async () => {
          this.setSource(this.sourceSelect.value);
          if (this.source !== "device") {
            return;
          }
          // Ask for the device audio right away, so that recording can start instantly later.
          try {
            await getRecorder("device");
          } catch (e) {
            this.setSource("mic");
            showCaptureError(e);
          }
        });

        this.groupSelect.addEventListener("change", () => {
          this.setGroup(groups.find(g => String(g.id) === this.groupSelect.value) || null);
        });

        this.handleEl.addEventListener("pointerdown", e => startTrackDrag(this, e));

        this.gainRangeEl.addEventListener("input", () => {
          this.gainValue = parseFloat(this.gainRangeEl.value);

          if (this.gainValue === 0) {
            this.mute();
          } else {
            this.unmute();
          }
        });

        this.syncButton.addEventListener("click", () => {
          this.setSync(!this.playEntireBufferBeforeRepeat);
          this.play();
        });

        this.offsetPlusButton.addEventListener("click", e => {
          this.nudge(e.shiftKey ? FINE_NUDGE_STEP : NUDGE_STEP);
        });

        this.offsetMinusButton.addEventListener("click", e => {
          this.nudge(-(e.shiftKey ? FINE_NUDGE_STEP : NUDGE_STEP));
        });

        this.trimButton.addEventListener("click", () => {
          this.setTrimming(!this.isTrimming);
        });

        this.waveformEl.addEventListener("keydown", e => {
          if (this.isTrimming && this.buffer) {
            if (e.key === "Enter") {
              e.preventDefault();
              this.activeTrimHandle = this.activeTrimHandle === "start" ? "end" : "start";
              this.updateScreenInfo();
              return;
            }
            if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") {
              return;
            }
            e.preventDefault();
            const step = (e.shiftKey ? FINE_NUDGE_STEP : NUDGE_STEP) * (e.key === "ArrowRight" ? 1 : -1);
            const handleTime = this.activeTrimHandle === "start"
              ? this.trimStart
              : this.buffer.duration - this.trimEnd;
            this.setTrimHandle(handleTime + step);
            this.play();
            return;
          }

          if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") {
            return;
          }
          e.preventDefault();
          const step = e.shiftKey ? FINE_NUDGE_STEP : NUDGE_STEP;
          this.nudge(e.key === "ArrowRight" ? step : -step);
        });

        this.waveformEl.addEventListener("pointerdown", e => {
          if (!this.loopBuffer) {
            return;
          }

          if (this.isTrimming) {
            const time = this.pointerToRawTime(e);
            const startPos = this.trimStart;
            const endPos = this.buffer.duration - this.trimEnd;
            this.activeTrimHandle = Math.abs(time - startPos) <= Math.abs(time - endPos) ? "start" : "end";
            this.waveformEl.setPointerCapture(e.pointerId);
            this.drag = { mode: "trim" };
            this.setTrimHandle(time);
            return;
          }

          this.waveformEl.setPointerCapture(e.pointerId);
          this.drag = { mode: "offset", startX: e.clientX, startOffset: this.offset };
        });

        this.waveformEl.addEventListener("pointermove", e => {
          if (!this.drag) {
            return;
          }

          if (this.drag.mode === "trim") {
            this.setTrimHandle(this.pointerToRawTime(e));
            return;
          }

          const dx = e.clientX - this.drag.startX;
          this.setOffset(this.drag.startOffset + dx / this.waveformEl.clientWidth * this.loopDuration);

          // Let the user hear the change while dragging, without restarting too often.
          if (performance.now() - this.lastLiveRestart > 80) {
            this.lastLiveRestart = performance.now();
            this.restartVoice();
          }
        });

        const endDrag = () => {
          if (!this.drag) {
            return;
          }
          const { mode } = this.drag;
          this.drag = null;
          if (mode === "trim") {
            this.play();
          } else {
            this.restartVoice();
          }
        };
        this.waveformEl.addEventListener("pointerup", endDrag);
        this.waveformEl.addEventListener("pointercancel", endDrag);

        this.updateScreenInfo();
      }

      pointerToRawTime(e) {
        const rect = this.waveformEl.getBoundingClientRect();
        return (e.clientX - rect.left) / rect.width * this.buffer.duration;
      }

      setTrimming(on) {
        if (on && !this.buffer) {
          return;
        }
        this.isTrimming = on;
        this.drag = null;
        this.trimButton.classList.toggle("active", on);
        this.el.classList.toggle("trimming", on);
        this.updateScreenInfo();
      }

      // Moves the active trim handle to `time`, in seconds within the raw recording.
      setTrimHandle(time) {
        const d = this.buffer.duration;
        if (this.activeTrimHandle === "start") {
          this.trimStart = Math.min(Math.max(0, time), Math.max(0, d - this.trimEnd - MIN_TRIM_KEEP));
        } else {
          this.trimEnd = Math.min(Math.max(0, d - time), Math.max(0, d - this.trimStart - MIN_TRIM_KEEP));
        }
        this.updateScreenInfo();
      }

      updateScreenInfo() {
        const canvas = this.waveformEl;
        if (this.isTrimming) {
          const start = Math.round(this.trimStart * 1000);
          const end = Math.round(this.trimEnd * 1000);
          this.screenOffset.textContent = `trim: ${start} ms | ${end} ms`;
          canvas.tabIndex = 0;
          canvas.setAttribute("aria-label", "Trim. Drag the start or end handle, or use arrow keys. Enter switches handle");
          canvas.setAttribute("aria-valuetext", this.activeTrimHandle === "start"
            ? `start trimmed by ${start} ms`
            : `end trimmed by ${end} ms`);
          canvas.title = "Drag the handles to silence the start or end of the recording";
          return;
        }

        const text = formatOffset(this.offset);
        this.screenOffset.textContent = `offset: ${text}`;
        canvas.tabIndex = 0;
        canvas.setAttribute("aria-label", "Track offset. Drag, or use arrow keys, to align with the other tracks");
        canvas.setAttribute("aria-valuetext", text);
        canvas.title = "Drag the waveform to line it up with the other tracks (in grey) and the beats";
      }

      createDom() {
        this.el = document.createElement("section");
        this.el.classList.add("track");

        this.handleEl = document.createElement("div");

        this.screenStatus = document.createElement("div");

        this.videoToggle = document.createElement("button");
