<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>looper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --button-size: 4rem;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      text-transform: uppercase;
    }

    .wrapper {
      background: rgb(157, 157, 157);
      background-image: url(https://media.istockphoto.com/id/957053842/vector/noise-pattern-seamless-grunge-texture-white-paper-vector.jpg?s=612x612&w=0&k=20&c=Lw_aDEQiLqsAXkqXp5M710I5wpAQKv2Z8icbzOjVljY=);
      min-height: 100%;
      display: grid;
      grid-template-rows: min-content;
    }

    h1,
    p {
      margin: 0;
    }

    header {
      background: rgba(237, 237, 237, 0.933);
      padding: 1rem;
      box-shadow: 0 0 0.25rem 0.25rem #0000006e;
    }

    header h1 {
      font-weight: normal;
    }

    header a {
      color: rgb(210, 88, 2);
      text-decoration: none;
    }

    header a:hover {
      text-decoration: underline;
    }

    header p {
      margin-block-start: 2rem;
    }

    input,
    button {
      font-family: inherit;
      font-size: inherit;
      text-transform: uppercase;
    }

    #looper {
      min-width: 12rem;
      padding: 1rem;
      background: rgba(132, 132, 132, 0.85);
    }

    .buttons {
      display: grid;
      gap: 1rem;
      grid-auto-flow: column;
      justify-content: center;
      margin-block-end: 1rem;
    }

    button {
      border: 0;
      padding: 0;
      background: black;
      aspect-ratio: 1;
      width: var(--button-size);
      position: relative;
      font-size: .7rem;
      text-align: start;
    }


    button::before {
      content: "";
      position: absolute;
      inset: .1rem;
      background: #333;
      border-radius: .25rem;
      aspect-ratio: 1;
      box-shadow: inset .05rem .05rem .1rem 0 #fffe, inset -.05rem -.05rem .1rem 0 #0009, .25rem .25rem .5rem .1rem #0006;
    }

    button.small,
    button.small::before {
      aspect-ratio: 2;
    }

    button.record::before {
      background-color: #d25802;
    }

    button.clear::before,
    button.danger::before {
      background-color: #7e0000;
    }

    .loop-panel {
      display: flex;
      gap: .5rem;
      justify-content: center;
      align-items: center;
      margin-block-end: 1rem;
    }

    .loop-panel[hidden] {
      display: none;
    }

    .loop-panel .screen {
      background: #171717;
      color: #fff;
      font-size: .6rem;
      padding: .5rem;
      width: 12rem;
      box-sizing: border-box;
      box-shadow: inset .125rem .125rem .1rem 0 #0004;
    }

    .loop-length-field {
      display: flex;
      align-items: baseline;
      gap: .25rem;
      font-size: 1.2rem;
    }

    .loop-length-field input {
      width: 100%;
      background: transparent;
      border: 0;
      border-block-end: 1px solid #fff4;
      color: #ff9a4d;
      font-size: inherit;
      padding: 0;
    }

    .loop-length-field input:focus-visible {
      outline: none;
      border-block-end-color: #d25802;
    }

    .tracks > #add-track {
      align-self: center;
    }

    button span {
      color: white;
      position: absolute;
      inset: .25rem .5rem;
      text-shadow: -1px -1px 0 #0000006e;
    }


    button:active::before,
    button.active::before {
      scale: .999;
      transform-origin: center;
      box-shadow: inset .25rem .25rem .5rem #000c, inset .05rem .05rem .1rem 0 #fffe, inset -.05rem -.05rem .1rem 0 #0009, .25rem .25rem .5rem 0rem #0006;
    }

    button:active span,
    button.active span {
      scale: .999;
    }

    .tracks {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      justify-content: center;
    }

    .track {
      padding: .125rem;
      display: grid;
      grid-template-columns: repeat(4, var(--button-size));
      grid-template-rows: repeat(2, var(--button-size)) var(--button-size) repeat(2, calc(var(--button-size) / 2));
      grid-template-areas:
        "screen screen screen screen"
        "screen screen screen screen"
        "rec    mute   gain   trim"
        "sync   plus  gain   dup"
        "sync minus gain clear";
      justify-items: center;
      background: #eee4;
      box-shadow: inset .125rem .125rem .1rem 0 #0004;
    }

    .track .record {
      grid-area: rec;
    }

    .track .trim {
      grid-area: trim;
    }

    .track .sync {
      grid-area: sync;
    }

    .track .offset-plus {
      grid-area: plus;
    }

    .track .offset-minus {
      grid-area: minus;
    }

    .track .screen {
      grid-area: screen;
      background: #171717;
      width: 100%;
      background-image: linear-gradient(to bottom, transparent, #171717 50%), linear-gradient(to bottom right, transparent, #fff1 40%, transparent 0);
      color: #ffffff;
      font-size: .6rem;
      padding: .5rem;
      box-sizing: border-box;
      display: grid;
      grid-template-rows: auto auto auto auto 1fr;
      min-height: 0;
    }

    .track .waveform {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      margin-block-start: .25rem;
      background: #0008;
      border-radius: .125rem;
      touch-action: none;
    }

    .track.has-buffer .waveform {
      cursor: ew-resize;
    }

    .track.has-buffer.trimming .waveform {
      cursor: col-resize;
    }

    .track .waveform:focus-visible {
      outline: 1px solid #d25802;
    }

    .track .mute {
      grid-area: mute;
    }

    .track .clear {
      grid-area: clear;
    }

    .track .gain {
      grid-area: gain;
    }

    .track .duplicate {
      grid-area: dup;
    }

    .track .screen .track-name {
      display: flex;
      gap: .5em;
    }

    .track .screen .track-name input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      border-block-end: 1px dashed transparent;
      color: inherit;
      font-size: inherit;
      padding: 0;
    }

    .track .screen .track-name input:hover {
      border-block-end-color: #fff4;
    }

    .track .screen .track-name input:focus-visible {
      outline: none;
      border-block-end: 1px solid #d25802;
    }

    .has-buffer .track-status {
      font-weight: bold;
    }

    .track .gain {
      rotate: -90deg;
      -webkit-appearance: none;
      background: transparent;
      background-image: linear-gradient(to right, #fff4 0 .05rem, #8c8c8c .05rem .2rem, transparent 0);
      background-size: .125rem 50%;
      background-repeat: no-repeat;
      background-position: center;
      place-self: center;
      height: 6rem;
      width: 7rem;
    }

    .track .gain::-webkit-slider-runnable-track {
      background: rgb(34, 29, 29);
      border-radius: 100vw;
      height: .5rem;
      box-shadow: inset -.125rem .125rem .25rem 0 black, -1px 1px .125rem 0 #fffa;
    }

    .track .gain::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 50%;
      background: #8c8c8c;
      box-shadow: inset -.05rem .05rem .1rem 0 #fffe, inset .05rem -.05rem .1rem 0 #0009, -.25rem .25rem .5rem .1rem #0006;
      border: 0;
      translate: 0 -.65rem;
    }

    .track .gain::-moz-range-track {
      background: rgb(34, 29, 29);
      border-radius: 100vw;
      height: .5rem;
      box-shadow: inset -.125rem .125rem .25rem 0 black, -1px 1px .125rem 0 #fffa;
    }

    .track .gain::-moz-range-thumb {
      -webkit-appearance: none;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 50%;
      background: #8c8c8c;
      box-shadow: inset -.05rem .05rem .1rem 0 #fffe, inset .05rem -.05rem .1rem 0 #0009, -.25rem .25rem .5rem .1rem #0006;
      border: 0;
    }

    .track.is-recording .record {
      background-color: rgb(237, 66, 66);
    }

    .track.has-buffer .record {
      background-color: #00ff25;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <header>
      <h1>Looper</h1>
      <a href="https://patrickbrosset.com">Patrick Brosset</a>
      <p>multi-track audio looper</p>
    </header>
    <main id="looper">
      <div class="buttons">
        <button id="start" title="Start the looper"><span>Start</span></button>
        <button id="clear-all" class="danger" title="Clear all tracks" hidden><span>clear all</span></button>
        <button id="download" title="Download one full cycle of the loop as a WAV file" hidden><span>save</span></button>
      </div>
      <section class="loop-panel" hidden>
        <div class="screen">
          <label for="loop-length">loop length</label>
          <div class="loop-length-field">
            <input id="loop-length" type="number" min="0.1" max="60" step="0.001" placeholder="-" inputmode="decimal">
            <span>s</span>
          </div>
          <div id="loop-info">tap or type a length</div>
        </div>
        <button id="tap" title="Press once on a beat, and again on the next beat, to set the loop length"><span>tap</span></button>
        <button id="metronome" class="active" title="Play a click on every beat of the loop"><span>click</span></button>
      </section>
      <div class="tracks">
        <button id="add-track" title="Add a new track" hidden><span>add</span></button>
      </div>
    </main>
  </div>


  <script>
    function formatTime(time) {
      return Math.round(time * 10) / 10;
    }

    function formatOffset(seconds) {
      const ms = Math.round(seconds * 1000);
      return `${ms > 0 ? "+" : ""}${ms} ms`;
    }

    function mod(a, n) {
      return ((a % n) + n) % n;
    }

    // Make it possible to play and record at the same time on iOS.
    if (navigator.audioSession) {
      navigator.audioSession.type = "play-and-record";
    }

    const startLooperButton = document.querySelector("#start");
    const addTrackButton = document.querySelector("#add-track");
    const clearAllButton = document.querySelector("#clear-all");
    const downloadButton = document.querySelector("#download");
    const tracksEl = document.querySelector(".tracks");
    const loopPanel = document.querySelector(".loop-panel");
    const loopLengthInput = document.querySelector("#loop-length");
    const loopInfo = document.querySelector("#loop-info");
    const tapButton = document.querySelector("#tap");
    const metronomeButton = document.querySelector("#metronome");

    const DEFAULT_GAIN_VALUE = 0.5;
    // Offset nudge steps, in seconds.
    const NUDGE_STEP = 0.01;
    const FINE_NUDGE_STEP = 0.001;
    // Short crossfade used when restarting a track, to avoid clicks.
    const CROSSFADE = 0.015;
    // How far in the future a (re)started track gets scheduled.
    const SCHEDULE_AHEAD = 0.03;
    const WAVEFORM_RESOLUTION = 2048;
    // Fade applied at trim points, to avoid clicks.
    const TRIM_FADE = 0.005;
    // Minimum length of audio kept when trimming.
    const MIN_TRIM_KEEP = 0.05;
    const MIN_LOOP_LENGTH = 0.1;
    const MAX_LOOP_LENGTH = 60;
    // The loop is divided in this many beats, for the metronome and guides.
    const BEATS_PER_LOOP = 4;

    // Records mic input inside the audio graph, so that we know the exact
    // audio context time of every recorded sample.
    const RECORDER_WORKLET = `
      class RecorderProcessor extends AudioWorkletProcessor {
        constructor() {
          super();
          this.recording = false;
          this.port.onmessage = e => {
            if (e.data === "start") {
              this.recording = true;
            } else if (e.data === "stop") {
              this.recording = false;
              this.port.postMessage({ type: "stop" });
            }
          };
        }

        process(inputs) {
          if (!this.recording) {
            return true;
          }

          const channels = inputs[0];
          const mono = new Float32Array(channels.length ? channels[0].length : 128);
          for (const channel of channels) {
            for (let i = 0; i < channel.length; i++) {
              mono[i] += channel[i] / channels.length;
            }
          }
          this.port.postMessage({ type: "data", frame: currentFrame, data: mono }, [mono.buffer]);
          return true;
        }
      }
      registerProcessor("recorder", RecorderProcessor);
    `;

    let audioContext = null;
    let micRecorder = null;
    let tracks = [];
    const initTrackNb = 4;
    let isDrawing = false;

    // The loop every track is synced to. `length` is in frames (0 when not set yet),
    // `anchor` is the audio context time at which a loop starts.
    const loop = { length: 0, anchor: 0, tapStart: null };
    const metronome = { enabled: true, nextBeat: null, output: null, interval: null };

    function getLoopDuration() {
      return loop.length / audioContext.sampleRate;
    }

    function setLoop(seconds, anchor) {
      if (!(seconds >= MIN_LOOP_LENGTH && seconds <= MAX_LOOP_LENGTH)) {
        updateLoopInfo();
        return;
      }

      loop.length = Math.round(seconds * audioContext.sampleRate);
      loop.anchor = anchor;
      metronome.nextBeat = null;
      updateLoopInfo();
      tracks.forEach(track => track.play());
    }

    function resetLoop() {
      loop.length = 0;
      loop.anchor = 0;
      loop.tapStart = null;
      metronome.nextBeat = null;
      tapButton.classList.remove("active");
      updateLoopInfo();
    }

    function updateLoopInfo() {
      if (loop.tapStart !== null) {
        loopInfo.textContent = "tap again on the next beat";
        return;
      }
      if (!loop.length) {
        loopLengthInput.value = "";
        loopInfo.textContent = "tap or type a length";
        return;
      }
      const duration = getLoopDuration();
      loopLengthInput.value = Math.round(duration * 1000) / 1000;
      loopInfo.textContent = `${Math.round(60 / (duration / BEATS_PER_LOOP) * 10) / 10} bpm (${BEATS_PER_LOOP} beats)`;
    }

    function tap() {
      const now = audioContext.currentTime;
      if (loop.tapStart === null) {
        loop.tapStart = now;
        tapButton.classList.add("active");
        updateLoopInfo();
        return;
      }

      const start = loop.tapStart;
      loop.tapStart = null;
      tapButton.classList.remove("active");
      // The loop starts on the first tap.
      setLoop(now - start, start);
    }

    function playClick(time, accent) {
      const osc = audioContext.createOscillator();
      osc.frequency.value = accent ? 1600 : 1000;
      const gain = audioContext.createGain();
      gain.gain.setValueAtTime(accent ? 0.5 : 0.25, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
      osc.connect(gain);
      gain.connect(metronome.output);
      osc.start(time);
      osc.stop(time + 0.05);
      osc.onended = () => gain.disconnect();
    }

    // Schedules the metronome clicks a little bit ahead of time.
    function scheduleClicks() {
      if (!loop.length || !metronome.enabled) {
        metronome.nextBeat = null;
        return;
      }

      const beat = getLoopDuration() / BEATS_PER_LOOP;
      const now = audioContext.currentTime;
      if (metronome.nextBeat === null) {
        metronome.nextBeat = Math.ceil((now + SCHEDULE_AHEAD - loop.anchor) / beat);
      }
      while (loop.anchor + metronome.nextBeat * beat < now + 0.2) {
        const time = loop.anchor + metronome.nextBeat * beat;
        if (time >= now) {
          playClick(time, mod(metronome.nextBeat, BEATS_PER_LOOP) === 0);
        }
        metronome.nextBeat++;
      }
    }

    // Returns a buffer of exactly `length` frames, where the recorded audio that
    // goes beyond `length` wraps around to the start (like overlapping loops would).
    function foldBuffer(buffer, length) {
      const out = audioContext.createBuffer(buffer.numberOfChannels, length, buffer.sampleRate);
      for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
        const src = buffer.getChannelData(ch);
        const dst = out.getChannelData(ch);
        for (let i = 0; i < src.length; i++) {
          dst[i % length] += src[i];
        }
      }
      return out;
    }

    // Returns a copy of `buffer` where the first `start` and last `end` seconds are silenced.
    function trimBuffer(buffer, start, end) {
      if (!start && !end) {
        return buffer;
      }

      const sampleRate = buffer.sampleRate;
      const length = buffer.length;
      const startFrame = Math.round(start * sampleRate);
      const endFrame = length - Math.round(end * sampleRate);
      const fade = Math.round(TRIM_FADE * sampleRate);
      const out = audioContext.createBuffer(buffer.numberOfChannels, length, sampleRate);

      for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
        const src = buffer.getChannelData(ch);
        const dst = out.getChannelData(ch);
        for (let i = startFrame; i < endFrame; i++) {
          let g = 1;
          if (start && i < startFrame + fade) {
            g = (i - startFrame) / fade;
          }
          if (end && i >= endFrame - fade) {
            g = Math.min(g, (endFrame - i) / fade);
          }
          dst[i] = src[i] * g;
        }
      }
      return out;
    }

    function encodeWav(buffer) {
      const channels = buffer.numberOfChannels;
      const length = buffer.length;
      const data = [];
      let peak = 0;
      for (let ch = 0; ch < channels; ch++) {
        const channelData = buffer.getChannelData(ch);
        data.push(channelData);
        for (let i = 0; i < length; i++) {
          peak = Math.max(peak, Math.abs(channelData[i]));
        }
      }
      // Avoid clipping if the mix got too loud.
      const scale = peak > 1 ? 0.99 / peak : 1;

      const view = new DataView(new ArrayBuffer(44 + length * channels * 2));
      const writeString = (offset, str) => [...str].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
      writeString(0, "RIFF");
      view.setUint32(4, 36 + length * channels * 2, true);
      writeString(8, "WAVE");
      writeString(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, channels, true);
      view.setUint32(24, buffer.sampleRate, true);
      view.setUint32(28, buffer.sampleRate * channels * 2, true);
      view.setUint16(32, channels * 2, true);
      view.setUint16(34, 16, true);
      writeString(36, "data");
      view.setUint32(40, length * channels * 2, true);

      let offset = 44;
      for (let i = 0; i < length; i++) {
        for (let ch = 0; ch < channels; ch++) {
          const sample = Math.max(-1, Math.min(1, data[ch][i] * scale));
          view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
          offset += 2;
        }
      }
      return new Blob([view], { type: "audio/wav" });
    }

    function computePeaks(buffer) {
      const data = buffer.getChannelData(0);
      const peaks = new Float32Array(WAVEFORM_RESOLUTION);
      const blockSize = data.length / WAVEFORM_RESOLUTION;
      let max = 0;
      for (let i = 0; i < WAVEFORM_RESOLUTION; i++) {
        const end = Math.min(data.length, Math.floor((i + 1) * blockSize));
        let peak = 0;
        for (let j = Math.floor(i * blockSize); j < end; j++) {
          peak = Math.max(peak, Math.abs(data[j]));
        }
        peaks[i] = peak;
        max = Math.max(max, peak);
      }
      if (max > 0) {
        for (let i = 0; i < peaks.length; i++) {
          peaks[i] /= max;
        }
      }
      return peaks;
    }

    // Draws `peaks` across the canvas. Column x shows the peaks found at
    // fraction (start + x / w * scale) of the buffer, wrapping around.
    function drawPeaks(ctx, peaks, w, h, start, scale, color) {
      const n = peaks.length;
      ctx.fillStyle = color;
      for (let x = 0; x < w; x++) {
        const from = Math.floor((start + x / w * scale) * n);
        const to = Math.max(from + 1, Math.floor((start + (x + 1) / w * scale) * n));
        let peak = 0;
        for (let i = from; i < to; i++) {
          peak = Math.max(peak, peaks[mod(i, n)]);
        }
        const barHeight = Math.max(1, peak * h * 0.9);
        ctx.fillRect(x, (h - barHeight) / 2, 1, barHeight);
      }
    }

    class Track {
      constructor(parentEl, micRecorder, { name, before = addTrackButton } = {}) {
        this.parentEl = parentEl;
        this.micRecorder = micRecorder;

        this.createDom();
        this.defaultName = name;
        this.nameInput.value = name;

        this.parentEl.insertBefore(this.el, before);

        // The raw recorded buffer.
        this.buffer = null;
        // The buffer actually looped, its length is a multiple of the loop's.
        this.loopBuffer = null;
        this.loopDuration = 0;
        this.iterations = 1;
        this.peaks = null;
        // Peaks of the raw recording, shown when trimming.
        this.rawPeaks = null;
        // Seconds silenced at the start and end of the raw recording.
        this.trimStart = 0;
        this.trimEnd = 0;
        this.isTrimming = false;
        this.activeTrimHandle = "start";
        this.state = 0;
        this.isMuted = false;
        this.gainValue = DEFAULT_GAIN_VALUE;
        this.playEntireBufferBeforeRepeat = true;
        // Audio context time at which the first sample of the buffer was played
        // (or should have been played, to be in sync with what was heard).
        this.anchorTime = 0;
        // User adjustment, in seconds, on top of the anchor time.
        this.offset = 0;
        this.voice = null;
        this.drag = null;
        this.lastLiveRestart = 0;

        this.outputGain = audioContext.createGain();
        this.outputGain.gain.value = this.gainValue;
        this.outputGain.connect(audioContext.destination);

        this.muteButton.addEventListener("click", () => {
          this.toggleMute();
        });

        this.clearButton.addEventListener("click", () => {
          this.clear();
        });

        this.duplicateButton.addEventListener("click", () => {
          duplicateTrack(this);
        });

        this.nameInput.addEventListener("change", () => {
          this.nameInput.value = this.nameInput.value.trim() || this.defaultName;
        });

        this.recordButton.addEventListener("click", () => {
          if (!loop.length) {
            alert("Set the loop length first: tap it, or type it in seconds");
            return;
          }

          this.handleStartStopRecord();
        });

        this.gainRangeEl.addEventListener("input", () => {
          this.gainValue = parseFloat(this.gainRangeEl.value);

          if (this.gainValue === 0) {
            this.mute();
          } else {
            this.unmute();
          }
        });

        this.syncButton.addEventListener("click", () => {
          this.setSync(!this.playEntireBufferBeforeRepeat);
          this.play();
        });

        this.offsetPlusButton.addEventListener("click", e => {
          this.nudge(e.shiftKey ? FINE_NUDGE_STEP : NUDGE_STEP);
        });

        this.offsetMinusButton.addEventListener("click", e => {
          this.nudge(-(e.shiftKey ? FINE_NUDGE_STEP : NUDGE_STEP));
        });

        this.trimButton.addEventListener("click", () => {
          this.setTrimming(!this.isTrimming);
        });

        this.waveformEl.addEventListener("keydown", e => {
          if (this.isTrimming && this.buffer) {
            if (e.key === "Enter") {
              e.preventDefault();
              this.activeTrimHandle = this.activeTrimHandle === "start" ? "end" : "start";
              this.updateScreenInfo();
              return;
            }
            if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") {
              return;
            }
            e.preventDefault();
            const step = (e.shiftKey ? FINE_NUDGE_STEP : NUDGE_STEP) * (e.key === "ArrowRight" ? 1 : -1);
            const handleTime = this.activeTrimHandle === "start"
              ? this.trimStart
              : this.buffer.duration - this.trimEnd;
            this.setTrimHandle(handleTime + step);
            this.play();
            return;
          }

          if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") {
            return;
          }
          e.preventDefault();
          const step = e.shiftKey ? FINE_NUDGE_STEP : NUDGE_STEP;
          this.nudge(e.key === "ArrowRight" ? step : -step);
        });

        this.waveformEl.addEventListener("pointerdown", e => {
          if (!this.loopBuffer) {
            return;
          }

          if (this.isTrimming) {
            const time = this.pointerToRawTime(e);
            const startPos = this.trimStart;
            const endPos = this.buffer.duration - this.trimEnd;
            this.activeTrimHandle = Math.abs(time - startPos) <= Math.abs(time - endPos) ? "start" : "end";
            this.waveformEl.setPointerCapture(e.pointerId);
            this.drag = { mode: "trim" };
            this.setTrimHandle(time);
            return;
          }

          this.waveformEl.setPointerCapture(e.pointerId);
          this.drag = { mode: "offset", startX: e.clientX, startOffset: this.offset };
        });

        this.waveformEl.addEventListener("pointermove", e => {
          if (!this.drag) {
            return;
          }

          if (this.drag.mode === "trim") {
            this.setTrimHandle(this.pointerToRawTime(e));
            return;
          }

          const dx = e.clientX - this.drag.startX;
          this.setOffset(this.drag.startOffset + dx / this.waveformEl.clientWidth * this.loopDuration);

          // Let the user hear the change while dragging, without restarting too often.
          if (performance.now() - this.lastLiveRestart > 80) {
            this.lastLiveRestart = performance.now();
            this.restartVoice();
          }
        });

        const endDrag = () => {
          if (!this.drag) {
            return;
          }
          const { mode } = this.drag;
          this.drag = null;
          if (mode === "trim") {
            this.play();
          } else {
            this.restartVoice();
          }
        };
        this.waveformEl.addEventListener("pointerup", endDrag);
        this.waveformEl.addEventListener("pointercancel", endDrag);

        this.updateScreenInfo();
      }

      pointerToRawTime(e) {
        const rect = this.waveformEl.getBoundingClientRect();
        return (e.clientX - rect.left) / rect.width * this.buffer.duration;
      }

      setTrimming(on) {
        if (on && !this.buffer) {
          return;
        }
        this.isTrimming = on;
        this.drag = null;
        this.trimButton.classList.toggle("active", on);
        this.el.classList.toggle("trimming", on);
        this.updateScreenInfo();
      }

      // Moves the active trim handle to `time`, in seconds within the raw recording.
      setTrimHandle(time) {
        const d = this.buffer.duration;
        if (this.activeTrimHandle === "start") {
          this.trimStart = Math.min(Math.max(0, time), Math.max(0, d - this.trimEnd - MIN_TRIM_KEEP));
        } else {
          this.trimEnd = Math.min(Math.max(0, d - time), Math.max(0, d - this.trimStart - MIN_TRIM_KEEP));
        }
        this.updateScreenInfo();
      }

      updateScreenInfo() {
        const canvas = this.waveformEl;
        if (this.isTrimming) {
          const start = Math.round(this.trimStart * 1000);
          const end = Math.round(this.trimEnd * 1000);
          this.screenOffset.textContent = `trim: ${start} ms | ${end} ms`;
          canvas.tabIndex = 0;
          canvas.setAttribute("aria-label", "Trim. Drag the start or end handle, or use arrow keys. Enter switches handle");
          canvas.setAttribute("aria-valuetext", this.activeTrimHandle === "start"
            ? `start trimmed by ${start} ms`
            : `end trimmed by ${end} ms`);
          canvas.title = "Drag the handles to silence the start or end of the recording";
          return;
        }

        const text = formatOffset(this.offset);
        this.screenOffset.textContent = `offset: ${text}`;
        canvas.tabIndex = 0;
        canvas.setAttribute("aria-label", "Track offset. Drag, or use arrow keys, to align with the other tracks");
        canvas.setAttribute("aria-valuetext", text);
        canvas.title = "Drag the waveform to line it up with the other tracks (in grey) and the beats";
      }

      createDom() {
        this.el = document.createElement("section");
        this.el.classList.add("track");

        this.recordButton = document.createElement("button");
        this.recordButton.classList.add("record");
        this.recordButton.title = "Record";
        this.recordButton.innerHTML = "<span>record</span>";
        this.el.appendChild(this.recordButton);

        this.syncButton = document.createElement("button");
        this.syncButton.classList.add("sync");
        this.syncButton.title = "Toggle between looping the entire recording, or restarting it with every loop";
        this.syncButton.innerHTML = "<span>sync</span>";
        this.el.appendChild(this.syncButton);

        this.offsetPlusButton = document.createElement("button");
        this.offsetPlusButton.classList.add("offset-plus");
        this.offsetPlusButton.classList.add("small");
        this.offsetPlusButton.title = "Play track 10ms later (shift+click: 1ms)";
        this.offsetPlusButton.innerHTML = "<span>▶ 10ms</span>";
        this.el.appendChild(this.offsetPlusButton);

        this.offsetMinusButton = document.createElement("button");
        this.offsetMinusButton.classList.add("offset-minus");
        this.offsetMinusButton.classList.add("small");
        this.offsetMinusButton.title = "Play track 10ms earlier (shift+click: 1ms)";
        this.offsetMinusButton.innerHTML = "<span>◀ 10ms</span>";
        this.el.appendChild(this.offsetMinusButton);

        this.screenEl = document.createElement("div");
        this.screenEl.classList.add("screen");
        this.el.appendChild(this.screenEl);

        const screenName = document.createElement("label");
        screenName.classList.add("track-name");
        screenName.textContent = "track:";
        this.nameInput = document.createElement("input");
        this.nameInput.type = "text";
        this.nameInput.maxLength = 20;
        this.nameInput.spellcheck = false;
        this.nameInput.autocomplete = "off";
        this.nameInput.title = "Rename the track";
        screenName.appendChild(this.nameInput);
        this.screenEl.appendChild(screenName);

        this.screenStatus = document.createElement("div");
        this.screenStatus.classList.add("track-status");
        this.screenStatus.textContent = "status: ready";
        this.screenEl.appendChild(this.screenStatus);

        this.screenDuration = document.createElement("div");
        this.screenDuration.classList.add("track-duration");
        this.screenDuration.textContent = "time: -";
        this.screenEl.appendChild(this.screenDuration);

        this.screenOffset = document.createElement("div");
        this.screenOffset.classList.add("track-offset");
        this.screenOffset.textContent = "offset: 0 ms";
        this.screenEl.appendChild(this.screenOffset);

        this.waveformEl = document.createElement("canvas");
        this.waveformEl.classList.add("waveform");
        this.waveformEl.height = 1;
        this.waveformEl.setAttribute("role", "slider");
        this.canvasCtx = this.waveformEl.getContext("2d");
        this.screenEl.appendChild(this.waveformEl);

        this.trimButton = document.createElement("button");
        this.trimButton.classList.add("trim");
        this.trimButton.title = "Trim: silence unwanted sounds at the start and end of the recording";
        this.trimButton.innerHTML = "<span>trim</span>";
        this.el.appendChild(this.trimButton);

        this.muteButton = document.createElement("button");
        this.muteButton.classList.add("mute");
        this.muteButton.title = "Mute/Unmute";
        this.muteButton.innerHTML = "<span>mute</span>";
        this.el.appendChild(this.muteButton);

        this.gainRangeEl = document.createElement("input");
        this.gainRangeEl.classList.add("gain");
        this.gainRangeEl.type = "range";
        this.gainRangeEl.min = 0;
        this.gainRangeEl.max = 1;
        this.gainRangeEl.step = 0.01;
        this.gainRangeEl.value = DEFAULT_GAIN_VALUE;
        this.el.appendChild(this.gainRangeEl);

        this.clearButton = document.createElement("button");
        this.clearButton.classList.add("clear", "small");
        this.clearButton.title = "Clear track";
        this.clearButton.innerHTML = "<span>clear</span>";
        this.el.appendChild(this.clearButton);

        this.duplicateButton = document.createElement("button");
        this.duplicateButton.classList.add("duplicate", "small");
        this.duplicateButton.title = "Duplicate track, with the same recording and settings";
        this.duplicateButton.innerHTML = "<span>dup</span>";
        this.el.appendChild(this.duplicateButton);
      }

      setSync(playEntireBufferBeforeRepeat) {
        this.playEntireBufferBeforeRepeat = playEntireBufferBeforeRepeat;
        this.syncButton.classList.toggle("active", !playEntireBufferBeforeRepeat);
        this.syncButton.innerHTML = playEntireBufferBeforeRepeat ? "<span>sync</span>" : "<span>unsync</span>";
      }

      // Copies the recording and all the settings of `source` into this track.
      copyFrom(source) {
        this.nameInput.value = `${source.nameInput.value} copy`.slice(0, this.nameInput.maxLength);
        this.gainValue = source.gainValue;
        this.gainRangeEl.value = source.gainRangeEl.value;
        if (source.isMuted) {
          this.mute();
        } else {
          this.unmute();
        }
        this.setSync(source.playEntireBufferBeforeRepeat);

        if (!source.buffer) {
          return;
        }

        this.state = 2;
        this.el.classList.add("has-buffer");
        this.screenStatus.textContent = "status: playing";
        this.buffer = source.buffer;
        this.rawPeaks = source.rawPeaks;
        this.trimStart = source.trimStart;
        this.trimEnd = source.trimEnd;
        this.anchorTime = source.anchorTime;
        this.offset = source.offset;
        this.play();
      }

      applyGain() {
        const value = this.isMuted ? 0 : this.gainValue;
        this.outputGain.gain.setTargetAtTime(value, audioContext.currentTime, 0.01);
      }

      toggleMute() {
        if (this.isMuted) {
          this.unmute();
        } else {
          this.mute();
        }
      }

      mute() {
        this.muteButton.innerHTML = "<span>unmute</span>";
        this.muteButton.classList.add("active");

        this.isMuted = true;
        this.el.classList.add("muted");

        this.gainRangeEl.value = 0;
        this.applyGain();
      }

      unmute() {
        if (this.gainValue === 0) {
          this.gainValue = DEFAULT_GAIN_VALUE;
        }

        this.muteButton.innerHTML = "<span>mute</span>";
        this.muteButton.classList.remove("active");

        this.isMuted = false;
        this.el.classList.remove("muted");

        this.gainRangeEl.value = this.gainValue;
        this.applyGain();
      }

      clear() {
        this.unmute();

        if (this.state === 1) {
          this.micRecorder.onBufferReady = () => { };
          this.micRecorder.stopRecording();
        }

        this.stopVoice();
        this.state = 0;
        this.buffer = null;
        this.loopBuffer = null;
        this.peaks = null;
        this.rawPeaks = null;
        this.trimStart = 0;
        this.trimEnd = 0;
        this.setTrimming(false);
        this.drag = null;
        this.setOffset(0);
        this.el.classList.remove("has-buffer", "is-recording");
        this.gainRangeEl.value = DEFAULT_GAIN_VALUE;

        this.screenStatus.textContent = "status: ready";
        this.screenDuration.textContent = "time: -";
      }

      handleStartStopRecord() {
        if (!this.state) {
          this.state = 1;
          this.micRecorder.onBufferReady = (buffer, startTime) => this.onRecorded(buffer, startTime);
          this.micRecorder.startRecording();
          this.el.classList.add("is-recording");
          this.screenStatus.textContent = "status: recording...";
        } else if (this.state === 1) {
          this.micRecorder.stopRecording();
          this.state = 2;
        } else if (this.state === 2) {
          this.clear();
          this.handleStartStopRecord();
        }
      }

      onRecorded(buffer, startTime) {
        this.el.classList.remove("is-recording");
        if (!buffer) {
          this.clear();
          return;
        }

        this.el.classList.add("has-buffer");
        this.screenStatus.textContent = "status: playing";

        this.buffer = buffer;
        this.rawPeaks = computePeaks(buffer);
        this.trimStart = 0;
        this.trimEnd = 0;
        // Shift the recording back by the round-trip audio latency, since the
        // user played along with what they heard, which was late.
        this.anchorTime = startTime - this.micRecorder.getRoundTripLatency();
        this.setOffset(0);
        this.play();
      }

      play() {
        if (!this.buffer || !loop.length) {
          return;
        }

        // Snap the nb of iterations to [1, 2, 4, 8, 16, 32, 64, etc.] so that the track
        // repeats at a regular interval.
        this.iterations = 1;
        if (this.playEntireBufferBeforeRepeat) {
          const nbOfLoopIterations = Math.max(1, Math.round(this.buffer.length / loop.length));
          this.iterations = Math.pow(2, Math.round(Math.log2(nbOfLoopIterations)));
        }

        // Using an exact multiple of the loop's length, in frames, means the
        // tracks can never drift apart.
        const loopLength = this.iterations * loop.length;
        this.loopBuffer = foldBuffer(trimBuffer(this.buffer, this.trimStart, this.trimEnd), loopLength);
        this.loopDuration = loopLength / audioContext.sampleRate;
        this.peaks = computePeaks(this.loopBuffer);
        this.setOffset(this.offset);

        this.screenDuration.textContent = `time: ${formatTime(this.loopDuration)} s (${this.iterations} ⨉ loop)`;

        this.restartVoice();
      }

      // (Re)start the looping buffer at the position it should currently be at.
      restartVoice() {
        if (!this.loopBuffer) {
          return;
        }

        const when = audioContext.currentTime + SCHEDULE_AHEAD;
        const position = mod(when - this.anchorTime - this.offset, this.loopDuration);

        const source = audioContext.createBufferSource();
        source.buffer = this.loopBuffer;
        source.loop = true;

        const gain = audioContext.createGain();
        gain.gain.setValueAtTime(0, when);
        gain.gain.linearRampToValueAtTime(1, when + CROSSFADE);

        source.connect(gain);
        gain.connect(this.outputGain);
        source.start(when, position);

        this.stopVoice(when);
        this.voice = { source, gain };
      }

      stopVoice(when = audioContext.currentTime) {
        if (!this.voice) {
          return;
        }

        const { source, gain } = this.voice;
        gain.gain.cancelScheduledValues(when);
        gain.gain.setValueAtTime(1, when);
        gain.gain.linearRampToValueAtTime(0, when + CROSSFADE);
        source.stop(when + CROSSFADE);
        source.onended = () => gain.disconnect();
        this.voice = null;
      }

      setOffset(value) {
        const d = this.loopDuration;
        // Keep the offset within half a loop on either side, it's circular anyway.
        this.offset = d ? mod(value + d / 2, d) - d / 2 : 0;
        this.updateScreenInfo();
      }

      nudge(delta) {
        if (!this.loopBuffer) {
          return;
        }
        this.setOffset(this.offset + delta);
        this.restartVoice();
      }

      // Shows the whole raw recording, with the trimmed parts dimmed.
      drawTrimView(ctx, w, h, dpr) {
        const d = this.buffer.duration;

        // Where the recording wraps around when looping.
        ctx.fillStyle = "#fff6";
        for (let t = this.loopDuration; t < d; t += this.loopDuration) {
          ctx.fillRect(Math.round(t / d * w), 0, 1, h);
        }

        drawPeaks(ctx, this.rawPeaks, w, h, 0, 1, "#d25802cc");

        const startX = Math.round(this.trimStart / d * w);
        const endX = Math.round((d - this.trimEnd) / d * w);
        ctx.fillStyle = "#000c";
        ctx.fillRect(0, 0, startX, h);
        ctx.fillRect(endX, 0, w - endX, h);

        const lineWidth = Math.max(1, Math.round(dpr));
        const tab = Math.round(6 * dpr);
        const focused = document.activeElement === this.waveformEl;
        for (const [handle, x, dir] of [["start", startX, 1], ["end", endX, -1]]) {
          const active = focused && this.activeTrimHandle === handle;
          ctx.fillStyle = active ? "#ff9a4d" : "#fff";
          const lineX = dir === 1 ? x : x - lineWidth;
          ctx.fillRect(lineX, 0, lineWidth, h);
          ctx.fillRect(dir === 1 ? x : x - tab, 0, tab, tab);
          ctx.fillRect(dir === 1 ? x : x - tab, h - tab, tab, tab);
        }
      }

      draw() {
        const canvas = this.waveformEl;
        const dpr = window.devicePixelRatio || 1;
        const w = Math.round(canvas.clientWidth * dpr);
        const h = Math.round(canvas.clientHeight * dpr);
        if (!w || !h) {
          return;
        }
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }

        const ctx = this.canvasCtx;
        ctx.clearRect(0, 0, w, h);

        if (!loop.length) {
          ctx.fillStyle = "#fff2";
          ctx.fillRect(0, Math.floor(h / 2), w, 1);
          return;
        }

        if (this.isTrimming && this.rawPeaks) {
          this.drawTrimView(ctx, w, h, dpr);
          return;
        }

        const duration = this.loopBuffer ? this.loopDuration : getLoopDuration();
        const iterations = this.loopBuffer ? this.iterations : 1;

        // Guides: loop boundaries, and beats.
        const guides = iterations * BEATS_PER_LOOP;
        for (let i = 1; i < guides; i++) {
          ctx.fillStyle = i % BEATS_PER_LOOP === 0 ? "#fff6" : "#fff1";
          ctx.fillRect(Math.round(i / guides * w), 0, 1, h);
        }

        // The other tracks' waveforms, in the background, as a reference.
        for (const other of tracks) {
          if (other === this || !other.peaks) {
            continue;
          }
          const otherShift = mod(other.anchorTime + other.offset - loop.anchor, other.loopDuration);
          drawPeaks(ctx, other.peaks, w, h, -otherShift / other.loopDuration, duration / other.loopDuration, "#ffffff30");
        }

        // This track's waveform, where it's actually heard relative to the loop.
        if (this.peaks) {
          const shift = mod(this.anchorTime + this.offset - loop.anchor, duration) / duration;
          drawPeaks(ctx, this.peaks, w, h, -shift, 1, this.drag ? "#ff9a4dcc" : "#d25802cc");
        }

        // Playhead, at what's currently being heard.
        const latency = (audioContext.outputLatency || 0) + (audioContext.baseLatency || 0);
        const heardTime = audioContext.currentTime - latency;
        const x = mod(heardTime - loop.anchor, duration) / duration * w;
        ctx.fillStyle = "#fff";
        ctx.fillRect(Math.floor(x), 0, Math.max(1, Math.round(dpr)), h);
      }
    }

    class MicRecorder {
      constructor() {
        this.stream = null;
        this.node = null;
        this.isRecording = false;
        this.chunks = [];
        this.startFrame = null;
        this.stopTime = 0;
        this.inputLatency = 0;
      }

      async setup() {
        this.stream = await navigator.mediaDevices.getUserMedia({
          video: false,
          audio: {
            echoCancellation: false,
            autoGainControl: false,
            noiseSuppression: false,
            latency: 0
          }
        });

        const settings = this.stream.getAudioTracks()[0].getSettings();
        this.inputLatency = settings.latency || 0;

        const moduleUrl = URL.createObjectURL(new Blob([RECORDER_WORKLET], { type: "application/javascript" }));
        await audioContext.audioWorklet.addModule(moduleUrl);
        URL.revokeObjectURL(moduleUrl);

        const source = audioContext.createMediaStreamSource(this.stream);
        this.node = new AudioWorkletNode(audioContext, "recorder");
        // The worklet needs to be connected to the destination to get processed,
        // but we don't want to hear the mic.
        const silence = audioContext.createGain();
        silence.gain.value = 0;
        source.connect(this.node);
        this.node.connect(silence);
        silence.connect(audioContext.destination);

        this.node.port.onmessage = e => {
          if (e.data.type === "data") {
            if (this.startFrame === null) {
              this.startFrame = e.data.frame;
            }
            this.chunks.push(e.data.data);
          } else if (e.data.type === "stop") {
            this.onStopped();
          }
        };
      }

      getRoundTripLatency() {
        return (audioContext.outputLatency || 0) + (audioContext.baseLatency || 0) + this.inputLatency;
      }

      // Call this to start recording.
      startRecording() {
        if (this.isRecording) {
          return;
        }

        this.chunks = [];
        this.startFrame = null;
        this.isRecording = true;
        this.node.port.postMessage("start");
      }

      // Call this to stop recording.
      stopRecording() {
        if (!this.isRecording) {
          return;
        }

        this.isRecording = false;
        this.stopTime = audioContext.currentTime;
        this.node.port.postMessage("stop");
      }

      onStopped() {
        const sampleRate = audioContext.sampleRate;
        const startTime = this.startFrame === null ? 0 : this.startFrame / sampleRate;
        const totalLength = this.chunks.reduce((sum, chunk) => sum + chunk.length, 0);
        // Trim the frames that were recorded after the stop button was pressed.
        const wantedLength = Math.round((this.stopTime - startTime) * sampleRate);
        const length = Math.min(totalLength, Math.max(0, wantedLength));

        if (!length) {
          this.onBufferReady(null, 0);
          return;
        }

        const buffer = audioContext.createBuffer(1, length, sampleRate);
        const data = buffer.getChannelData(0);
        let pos = 0;
        for (const chunk of this.chunks) {
          if (pos >= length) {
            break;
          }
          data.set(chunk.subarray(0, length - pos), pos);
          pos += chunk.length;
        }
        this.chunks = [];

        this.onBufferReady(buffer, startTime);
      }

      // Override this to get the newly recorded buffer, and the audio context
      // time of its first frame.
      onBufferReady() { }
    }

    function clearAll() {
      tracks.forEach(track => {
        track.unmute();
        track.clear();
      });
    }

    function addTrack() {
      const track = new Track(tracksEl, micRecorder, { name: String(tracks.length + 1) });
      tracks.push(track);
    }

    // Adds a copy of `source` right after it.
    function duplicateTrack(source) {
      const track = new Track(tracksEl, micRecorder, {
        name: String(tracks.length + 1),
        before: source.el.nextElementSibling
      });
      tracks.splice(tracks.indexOf(source) + 1, 0, track);
      track.copyFrom(source);
    }

    // Renders one full cycle of all the audible tracks (the length of the longest track)
    // and downloads it as a WAV file.
    async function downloadMix() {
      const recorded = tracks.filter(track => track.loopBuffer);
      if (!recorded.length) {
        alert("Record a track first");
        return;
      }

      const length = Math.max(...recorded.map(track => track.loopBuffer.length));
      const offline = new OfflineAudioContext(1, length, audioContext.sampleRate);

      for (const track of recorded) {
        if (track.isMuted || !track.gainValue) {
          continue;
        }
        const source = offline.createBufferSource();
        source.buffer = track.loopBuffer;
        source.loop = true;
        const gain = offline.createGain();
        gain.gain.value = track.gainValue;
        source.connect(gain);
        gain.connect(offline.destination);
        // Start the mix where the loop starts, keeping every track's alignment.
        source.start(0, mod(loop.anchor - track.anchorTime - track.offset, track.loopDuration));
      }

      downloadButton.disabled = true;
      try {
        const rendered = await offline.startRendering();
        const url = URL.createObjectURL(encodeWav(rendered));
        const link = document.createElement("a");
        link.href = url;
        link.download = `looper-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}.wav`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } finally {
        downloadButton.disabled = false;
      }
    }

    function drawLoop() {
      tracks.forEach(track => track.draw());
      requestAnimationFrame(drawLoop);
    }

    async function start() {
      clearAll();
      tracks.forEach(track => {
        track.outputGain.disconnect();
        track.el.remove();
      });
      tracks = [];

      // Create the audio context.
      if (!audioContext) {
        audioContext = new AudioContext({ latencyHint: "interactive" });
        metronome.output = audioContext.createGain();
        metronome.output.connect(audioContext.destination);
      }

      // Initialize the mic recorder.
      if (!micRecorder) {
        const recorder = new MicRecorder();
        await recorder.setup();
        micRecorder = recorder;
      }

      resetLoop();

      for (let i = 0; i < initTrackNb; i++) {
        addTrack();
      }

      // Show the main controls.
      loopPanel.hidden = false;
      addTrackButton.hidden = false;
      clearAllButton.hidden = false;
      downloadButton.hidden = false;

      startLooperButton.innerHTML = "<span>Restart</span>";
      startLooperButton.title = "Restart the looper, removing all tracks and the loop length";
      startLooperButton.classList.add("danger");

      if (!metronome.interval) {
        metronome.interval = setInterval(scheduleClicks, 25);
      }

      if (!isDrawing) {
        isDrawing = true;
        drawLoop();
      }
    }

    clearAllButton.addEventListener("click", clearAll);
    addTrackButton.addEventListener("click", addTrack);
    downloadButton.addEventListener("click", downloadMix);
    startLooperButton.addEventListener('click', start);
    tapButton.addEventListener("click", tap);
    metronomeButton.addEventListener("click", () => {
      metronome.enabled = !metronome.enabled;
      metronomeButton.classList.toggle("active", metronome.enabled);
    });
    loopLengthInput.addEventListener("change", () => {
      loop.tapStart = null;
      tapButton.classList.remove("active");
      const anchor = loop.length ? loop.anchor : audioContext.currentTime + SCHEDULE_AHEAD;
      setLoop(parseFloat(loopLengthInput.value), anchor);
    });
  </script>
</body>

</html>
