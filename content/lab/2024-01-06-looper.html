<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>looper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --button-size: 4rem;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      text-transform: uppercase;
    }

    .wrapper {
      background: rgb(157, 157, 157);
      background-image: url(https://media.istockphoto.com/id/957053842/vector/noise-pattern-seamless-grunge-texture-white-paper-vector.jpg?s=612x612&w=0&k=20&c=Lw_aDEQiLqsAXkqXp5M710I5wpAQKv2Z8icbzOjVljY=);
      min-height: 100%;
      display: grid;
      grid-template-rows: min-content;
    }

    h1,
    p {
      margin: 0;
    }

    header {
      background: rgba(237, 237, 237, 0.933);
      padding: 1rem;
      box-shadow: 0 0 0.25rem 0.25rem #0000006e;
    }

    header h1 {
      font-weight: normal;
    }

    header a {
      color: rgb(210, 88, 2);
      text-decoration: none;
    }

    header a:hover {
      text-decoration: underline;
    }

    header p {
      margin-block-start: 2rem;
    }

    input,
    button {
      font-family: inherit;
      font-size: inherit;
      text-transform: uppercase;
    }

    #looper {
      min-width: 12rem;
      padding: 1rem;
      background: rgba(132, 132, 132, 0.85);
    }

    .buttons {
      display: grid;
      gap: 1rem;
      grid-auto-flow: column;
      justify-content: center;
      margin-block-end: 1rem;
    }

    button {
      border: 0;
      padding: 0;
      background: black;
      aspect-ratio: 1;
      width: var(--button-size);
      position: relative;
      font-size: .7rem;
      text-align: start;
    }


    button::before {
      content: "";
      position: absolute;
      inset: .1rem;
      background: #333;
      border-radius: .25rem;
      aspect-ratio: 1;
      box-shadow: inset .05rem .05rem .1rem 0 #fffe, inset -.05rem -.05rem .1rem 0 #0009, .25rem .25rem .5rem .1rem #0006;
    }

    button.small,
    button.small::before {
      aspect-ratio: 2;
    }

    button.record::before {
      background-color: #d25802;
    }

    button.clear::before {
      background-color: #7e0000;
    }

    button span {
      color: white;
      position: absolute;
      inset: .25rem .5rem;
      text-shadow: -1px -1px 0 #0000006e;
    }


    button:active::before,
    button.active::before {
      scale: .999;
      transform-origin: center;
      box-shadow: inset .25rem .25rem .5rem #000c, inset .05rem .05rem .1rem 0 #fffe, inset -.05rem -.05rem .1rem 0 #0009, .25rem .25rem .5rem 0rem #0006;
    }

    button:active span,
    button.active span {
      scale: .999;
    }

    .tracks {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      justify-content: center;
    }

    .track {
      padding: .125rem;
      display: grid;
      grid-template-columns: repeat(4, var(--button-size));
      grid-template-rows: repeat(2, var(--button-size)) var(--button-size) repeat(2, calc(var(--button-size) / 2));
      grid-template-areas:
        "screen screen screen screen"
        "screen screen screen screen"
        "rec    mute   gain   ."
        "sync   plus  gain   clear"
        "sync minus gain clear";
      justify-items: center;
      counter-increment: track-nb;
      background: #eee4;
      box-shadow: inset .125rem .125rem .1rem 0 #0004;
    }

    .track .record {
      grid-area: rec;
    }

    .track .sync {
      grid-area: sync;
    }

    .track .offset-plus {
      grid-area: plus;
    }

    .track .offset-minus {
      grid-area: minus;
    }

    .track .screen {
      grid-area: screen;
      background: #171717;
      width: 100%;
      background-image: linear-gradient(to bottom, transparent, #171717 50%), linear-gradient(to bottom right, transparent, #fff1 40%, transparent 0);
      color: #ffffff;
      font-size: .6rem;
      padding: .5rem;
      box-sizing: border-box;
      display: grid;
      grid-template-rows: auto auto auto auto 1fr;
      min-height: 0;
    }

    .track .waveform {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      margin-block-start: .25rem;
      background: #0008;
      border-radius: .125rem;
      touch-action: none;
    }

    .track.has-buffer:not(.master) .waveform {
      cursor: ew-resize;
    }

    .track .waveform:focus-visible {
      outline: 1px solid #d25802;
    }

    .track .mute {
      grid-area: mute;
    }

    .track .clear {
      grid-area: clear;
    }

    .track .gain {
      grid-area: gain;
    }

    .track .screen .track-name::before {
      content: "track: " counter(track-nb);
    }

    .track.master .screen .track-name::before {
      content: "track: master";
    }

    .has-buffer .track-status {
      font-weight: bold;
    }

    .track .gain {
      rotate: -90deg;
      -webkit-appearance: none;
      background: transparent;
      background-image: linear-gradient(to right, #fff4 0 .05rem, #8c8c8c .05rem .2rem, transparent 0);
      background-size: .125rem 50%;
      background-repeat: no-repeat;
      background-position: center;
      place-self: center;
      height: 6rem;
      width: 7rem;
    }

    .track .gain::-webkit-slider-runnable-track {
      background: rgb(34, 29, 29);
      border-radius: 100vw;
      height: .5rem;
      box-shadow: inset -.125rem .125rem .25rem 0 black, -1px 1px .125rem 0 #fffa;
    }

    .track .gain::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 50%;
      background: #8c8c8c;
      box-shadow: inset -.05rem .05rem .1rem 0 #fffe, inset .05rem -.05rem .1rem 0 #0009, -.25rem .25rem .5rem .1rem #0006;
      border: 0;
      translate: 0 -.65rem;
    }

    .track .gain::-moz-range-track {
      background: rgb(34, 29, 29);
      border-radius: 100vw;
      height: .5rem;
      box-shadow: inset -.125rem .125rem .25rem 0 black, -1px 1px .125rem 0 #fffa;
    }

    .track .gain::-moz-range-thumb {
      -webkit-appearance: none;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 50%;
      background: #8c8c8c;
      box-shadow: inset -.05rem .05rem .1rem 0 #fffe, inset .05rem -.05rem .1rem 0 #0009, -.25rem .25rem .5rem .1rem #0006;
      border: 0;
    }

    .track.is-recording .record {
      background-color: rgb(237, 66, 66);
    }

    .track.has-buffer .record {
      background-color: #00ff25;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <header>
      <h1>Looper</h1>
      <a href="https://patrickbrosset.com">Patrick Brosset</a>
      <p>multi-track audio looper</p>
    </header>
    <main id="looper">
      <div class="buttons">
        <button id="start" title="Start the looper"><span>Start</span></button>
        <button id="mute-all" title="Mute all tracks" hidden><span>mute all</span></button>
        <button id="clear-all" title="Clear all tracks" hidden><span>clear all</span></button>
        <button id="add-track" title="Add a new track" hidden><span>add</span></button>
      </div>
      <div class="tracks">
      </div>
    </main>
  </div>


  <script>
    function formatTime(time) {
      return Math.round(time * 10) / 10;
    }

    function formatOffset(seconds) {
      const ms = Math.round(seconds * 1000);
      return `${ms > 0 ? "+" : ""}${ms} ms`;
    }

    function mod(a, n) {
      return ((a % n) + n) % n;
    }

    // Make it possible to play and record at the same time on iOS.
    if (navigator.audioSession) {
      navigator.audioSession.type = "play-and-record";
    }

    const startLooperButton = document.querySelector("#start");
    const muteAllButton = document.querySelector("#mute-all");
    const addTrackButton = document.querySelector("#add-track");
    const clearAllButton = document.querySelector("#clear-all");
    const tracksEl = document.querySelector(".tracks");

    const DEFAULT_GAIN_VALUE = 0.5;
    // Offset nudge steps, in seconds.
    const NUDGE_STEP = 0.01;
    const FINE_NUDGE_STEP = 0.001;
    // Short crossfade used when restarting a track, to avoid clicks.
    const CROSSFADE = 0.015;
    // How far in the future a (re)started track gets scheduled.
    const SCHEDULE_AHEAD = 0.03;
    const WAVEFORM_RESOLUTION = 2048;

    // Records mic input inside the audio graph, so that we know the exact
    // audio context time of every recorded sample.
    const RECORDER_WORKLET = `
      class RecorderProcessor extends AudioWorkletProcessor {
        constructor() {
          super();
          this.recording = false;
          this.port.onmessage = e => {
            if (e.data === "start") {
              this.recording = true;
            } else if (e.data === "stop") {
              this.recording = false;
              this.port.postMessage({ type: "stop" });
            }
          };
        }

        process(inputs) {
          if (!this.recording) {
            return true;
          }

          const channels = inputs[0];
          const mono = new Float32Array(channels.length ? channels[0].length : 128);
          for (const channel of channels) {
            for (let i = 0; i < channel.length; i++) {
              mono[i] += channel[i] / channels.length;
            }
          }
          this.port.postMessage({ type: "data", frame: currentFrame, data: mono }, [mono.buffer]);
          return true;
        }
      }
      registerProcessor("recorder", RecorderProcessor);
    `;

    let audioContext = null;
    let micRecorder = null;
    let tracks = [];
    let isAllMuted = false;
    const initTrackNb = 3;
    let masterTrack = null;
    let isDrawing = false;

    // Returns a buffer of exactly `length` frames, where the recorded audio that
    // goes beyond `length` wraps around to the start (like overlapping loops would).
    function foldBuffer(buffer, length) {
      const out = audioContext.createBuffer(buffer.numberOfChannels, length, buffer.sampleRate);
      for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
        const src = buffer.getChannelData(ch);
        const dst = out.getChannelData(ch);
        for (let i = 0; i < src.length; i++) {
          dst[i % length] += src[i];
        }
      }
      return out;
    }

    function computePeaks(buffer) {
      const data = buffer.getChannelData(0);
      const peaks = new Float32Array(WAVEFORM_RESOLUTION);
      const blockSize = data.length / WAVEFORM_RESOLUTION;
      let max = 0;
      for (let i = 0; i < WAVEFORM_RESOLUTION; i++) {
        const end = Math.min(data.length, Math.floor((i + 1) * blockSize));
        let peak = 0;
        for (let j = Math.floor(i * blockSize); j < end; j++) {
          peak = Math.max(peak, Math.abs(data[j]));
        }
        peaks[i] = peak;
        max = Math.max(max, peak);
      }
      if (max > 0) {
        for (let i = 0; i < peaks.length; i++) {
          peaks[i] /= max;
        }
      }
      return peaks;
    }

    // Draws `peaks` across the canvas. Column x shows the peaks found at
    // fraction (start + x / w * scale) of the buffer, wrapping around.
    function drawPeaks(ctx, peaks, w, h, start, scale, color) {
      const n = peaks.length;
      ctx.fillStyle = color;
      for (let x = 0; x < w; x++) {
        const from = Math.floor((start + x / w * scale) * n);
        const to = Math.max(from + 1, Math.floor((start + (x + 1) / w * scale) * n));
        let peak = 0;
        for (let i = from; i < to; i++) {
          peak = Math.max(peak, peaks[mod(i, n)]);
        }
        const barHeight = Math.max(1, peak * h * 0.9);
        ctx.fillRect(x, (h - barHeight) / 2, 1, barHeight);
      }
    }

    class Track {
      constructor(parentEl, micRecorder, masterTrack) {
        this.parentEl = parentEl;
        this.micRecorder = micRecorder;
        this.isMaster = !masterTrack;
        this.masterTrack = masterTrack;

        this.createDom();

        this.parentEl.appendChild(this.el);
        this.el.classList.toggle("master", this.isMaster);

        // The raw recorded buffer.
        this.buffer = null;
        // The buffer actually looped, its length is a multiple of the master's.
        this.loopBuffer = null;
        this.loopDuration = 0;
        this.iterations = 1;
        this.peaks = null;
        this.state = 0;
        this.isMuted = false;
        this.gainValue = DEFAULT_GAIN_VALUE;
        this.playEntireBufferBeforeRepeat = true;
        // Audio context time at which the first sample of the buffer was played
        // (or should have been played, to be in sync with what was heard).
        this.anchorTime = 0;
        // User adjustment, in seconds, on top of the anchor time.
        this.offset = 0;
        this.voice = null;
        this.drag = null;
        this.lastLiveRestart = 0;

        this.outputGain = audioContext.createGain();
        this.outputGain.gain.value = this.gainValue;
        this.outputGain.connect(audioContext.destination);

        this.muteButton.addEventListener("click", () => {
          this.muteButton.classList.toggle("active", !this.isMuted);
          this.toggleMute();
        });

        if (this.isMaster) {
          this.clearButton.setAttribute("disabled", true);
          this.offsetPlusButton.setAttribute("disabled", true);
          this.offsetMinusButton.setAttribute("disabled", true);
          this.syncButton.setAttribute("disabled", true);
        } else {
          this.clearButton.addEventListener("click", () => {
            this.clear();
          });
        }

        this.recordButton.addEventListener("click", () => {
          if (!this.isMaster && !this.masterTrack.buffer) {
            alert("Record the master track first");
            return;
          }

          this.handleStartStopRecord();
        });

        this.gainRangeEl.addEventListener("input", () => {
          this.gainValue = parseFloat(this.gainRangeEl.value);

          if (this.gainValue === 0) {
            this.mute();
          } else {
            this.unmute();
          }
        });

        this.syncButton.addEventListener("click", () => {
          this.playEntireBufferBeforeRepeat = !this.playEntireBufferBeforeRepeat;
          this.syncButton.classList.toggle("active", !this.playEntireBufferBeforeRepeat);
          this.syncButton.innerHTML = this.playEntireBufferBeforeRepeat ? "<span>sync</span>" : "<span>unsync</span>";
          this.play();
        });

        this.offsetPlusButton.addEventListener("click", e => {
          this.nudge(e.shiftKey ? FINE_NUDGE_STEP : NUDGE_STEP);
        });

        this.offsetMinusButton.addEventListener("click", e => {
          this.nudge(-(e.shiftKey ? FINE_NUDGE_STEP : NUDGE_STEP));
        });

        this.waveformEl.addEventListener("keydown", e => {
          if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") {
            return;
          }
          e.preventDefault();
          const step = e.shiftKey ? FINE_NUDGE_STEP : NUDGE_STEP;
          this.nudge(e.key === "ArrowRight" ? step : -step);
        });

        this.waveformEl.addEventListener("pointerdown", e => {
          if (this.isMaster || !this.loopBuffer) {
            return;
          }
          this.waveformEl.setPointerCapture(e.pointerId);
          this.drag = { startX: e.clientX, startOffset: this.offset };
        });

        this.waveformEl.addEventListener("pointermove", e => {
          if (!this.drag) {
            return;
          }
          const dx = e.clientX - this.drag.startX;
          this.setOffset(this.drag.startOffset + dx / this.waveformEl.clientWidth * this.loopDuration);

          // Let the user hear the change while dragging, without restarting too often.
          if (performance.now() - this.lastLiveRestart > 80) {
            this.lastLiveRestart = performance.now();
            this.restartVoice();
          }
        });

        const endDrag = () => {
          if (!this.drag) {
            return;
          }
          this.drag = null;
          this.restartVoice();
        };
        this.waveformEl.addEventListener("pointerup", endDrag);
        this.waveformEl.addEventListener("pointercancel", endDrag);
      }

      createDom() {
        this.el = document.createElement("section");
        this.el.classList.add("track");

        this.recordButton = document.createElement("button");
        this.recordButton.classList.add("record");
        this.recordButton.title = "Record";
        this.recordButton.innerHTML = "<span>record</span>";
        this.el.appendChild(this.recordButton);

        this.syncButton = document.createElement("button");
        this.syncButton.classList.add("sync");
        this.syncButton.title = "Toggle between looping the entire recording, or restarting it with every master loop";
        this.syncButton.innerHTML = "<span>sync</span>";
        this.el.appendChild(this.syncButton);

        this.offsetPlusButton = document.createElement("button");
        this.offsetPlusButton.classList.add("offset-plus");
        this.offsetPlusButton.classList.add("small");
        this.offsetPlusButton.title = "Play track 10ms later (shift+click: 1ms)";
        this.offsetPlusButton.innerHTML = "<span>▶ 10ms</span>";
        this.el.appendChild(this.offsetPlusButton);

        this.offsetMinusButton = document.createElement("button");
        this.offsetMinusButton.classList.add("offset-minus");
        this.offsetMinusButton.classList.add("small");
        this.offsetMinusButton.title = "Play track 10ms earlier (shift+click: 1ms)";
        this.offsetMinusButton.innerHTML = "<span>◀ 10ms</span>";
        this.el.appendChild(this.offsetMinusButton);

        this.screenEl = document.createElement("div");
        this.screenEl.classList.add("screen");
        this.el.appendChild(this.screenEl);

        const screenName = document.createElement("div");
        screenName.classList.add("track-name");
        this.screenEl.appendChild(screenName);

        this.screenStatus = document.createElement("div");
        this.screenStatus.classList.add("track-status");
        this.screenStatus.textContent = "status: ready";
        this.screenEl.appendChild(this.screenStatus);

        this.screenDuration = document.createElement("div");
        this.screenDuration.classList.add("track-duration");
        this.screenDuration.textContent = "time: -";
        this.screenEl.appendChild(this.screenDuration);

        this.screenOffset = document.createElement("div");
        this.screenOffset.classList.add("track-offset");
        this.screenOffset.textContent = "offset: 0 ms";
        this.screenEl.appendChild(this.screenOffset);

        this.waveformEl = document.createElement("canvas");
        this.waveformEl.classList.add("waveform");
        this.waveformEl.height = 1;
        this.canvasCtx = this.waveformEl.getContext("2d");
        if (!this.isMaster) {
          this.waveformEl.tabIndex = 0;
          this.waveformEl.setAttribute("role", "slider");
          this.waveformEl.setAttribute("aria-label", "Track offset. Drag, or use arrow keys, to align with the master track");
          this.waveformEl.setAttribute("aria-valuetext", "0 ms");
          this.waveformEl.title = "Drag the waveform to line it up with the master track (in grey)";
        }
        this.screenEl.appendChild(this.waveformEl);

        this.muteButton = document.createElement("button");
        this.muteButton.classList.add("mute");
        this.muteButton.title = "Mute/Unmute";
        this.muteButton.innerHTML = "<span>mute</span>";
        this.el.appendChild(this.muteButton);

        this.gainRangeEl = document.createElement("input");
        this.gainRangeEl.classList.add("gain");
        this.gainRangeEl.type = "range";
        this.gainRangeEl.min = 0;
        this.gainRangeEl.max = 1;
        this.gainRangeEl.step = 0.01;
        this.gainRangeEl.value = DEFAULT_GAIN_VALUE;
        this.el.appendChild(this.gainRangeEl);

        this.clearButton = document.createElement("button");
        this.clearButton.classList.add("clear");
        this.clearButton.title = "Clear track";
        this.clearButton.innerHTML = "<span>clear</span>";
        this.el.appendChild(this.clearButton);
      }

      applyGain() {
        const value = this.isMuted ? 0 : this.gainValue;
        this.outputGain.gain.setTargetAtTime(value, audioContext.currentTime, 0.01);
      }

      toggleMute() {
        if (this.isMuted) {
          this.unmute();
        } else {
          this.mute();
        }
      }

      mute() {
        this.muteButton.innerHTML = "<span>unmute</span>";

        this.isMuted = true;
        this.el.classList.add("muted");

        this.gainRangeEl.value = 0;
        this.applyGain();
      }

      unmute() {
        if (this.gainValue === 0) {
          this.gainValue = DEFAULT_GAIN_VALUE;
        }

        this.muteButton.innerHTML = "<span>mute</span>";

        this.isMuted = false;
        this.el.classList.remove("muted");

        this.gainRangeEl.value = this.gainValue;
        this.applyGain();
      }

      clear() {
        this.unmute();

        if (this.state === 1) {
          this.micRecorder.onBufferReady = () => { };
          this.micRecorder.stopRecording();
        }

        this.stopVoice();
        this.state = 0;
        this.buffer = null;
        this.loopBuffer = null;
        this.peaks = null;
        this.drag = null;
        this.setOffset(0);
        this.el.classList.remove("has-buffer", "is-recording");
        this.gainRangeEl.value = DEFAULT_GAIN_VALUE;

        this.screenStatus.textContent = "status: ready";
        this.screenDuration.textContent = "time: -";
      }

      handleStartStopRecord() {
        if (!this.state) {
          this.state = 1;
          this.micRecorder.onBufferReady = (buffer, startTime) => this.onRecorded(buffer, startTime);
          this.micRecorder.startRecording();
          this.el.classList.add("is-recording");
          this.screenStatus.textContent = "status: recording...";
          this.clearButton.setAttribute("disabled", true);
        } else if (this.state === 1) {
          this.micRecorder.stopRecording();
          this.state = 2;
        } else if (this.state === 2) {
          this.clear();
          this.handleStartStopRecord();
        }
      }

      onRecorded(buffer, startTime) {
        this.el.classList.remove("is-recording");
        if (!buffer) {
          this.clear();
          return;
        }

        this.el.classList.add("has-buffer");
        this.screenStatus.textContent = "status: playing";
        if (!this.isMaster) {
          this.clearButton.removeAttribute("disabled");
        }

        this.buffer = buffer;
        // The master track starts looping exactly where its recording started.
        // Other tracks are shifted back by the round-trip audio latency, since
        // the user played along with what they heard, which was late.
        this.anchorTime = this.isMaster
          ? startTime
          : startTime - this.micRecorder.getRoundTripLatency();
        this.setOffset(0);
        this.play();

        if (this.isMaster) {
          tracks.forEach(track => track !== this && track.play());
        }
      }

      play() {
        const master = this.isMaster ? this : this.masterTrack;
        if (!this.buffer || !master.buffer) {
          return;
        }

        const masterLength = master.buffer.length;

        // Snap the nb of iterations to [1, 2, 4, 8, 16, 32, 64, etc.] so that the track
        // repeats at a regular interval.
        this.iterations = 1;
        if (!this.isMaster && this.playEntireBufferBeforeRepeat) {
          const nbOfMasterIterations = Math.max(1, Math.round(this.buffer.length / masterLength));
          this.iterations = Math.pow(2, Math.round(Math.log2(nbOfMasterIterations)));
        }

        // Using an exact multiple of the master's length, in frames, means the
        // loops can never drift apart.
        const loopLength = this.iterations * masterLength;
        this.loopBuffer = foldBuffer(this.buffer, loopLength);
        this.loopDuration = loopLength / audioContext.sampleRate;
        this.peaks = computePeaks(this.loopBuffer);
        this.setOffset(this.offset);

        this.screenDuration.textContent = this.isMaster
          ? `time: ${formatTime(this.loopDuration)} s`
          : `time: ${formatTime(this.loopDuration)} s (${this.iterations} ⨉ master)`;

        this.restartVoice();
      }

      // (Re)start the looping buffer at the position it should currently be at.
      restartVoice() {
        if (!this.loopBuffer) {
          return;
        }

        const when = audioContext.currentTime + SCHEDULE_AHEAD;
        const position = mod(when - this.anchorTime - this.offset, this.loopDuration);

        const source = audioContext.createBufferSource();
        source.buffer = this.loopBuffer;
        source.loop = true;

        const gain = audioContext.createGain();
        gain.gain.setValueAtTime(0, when);
        gain.gain.linearRampToValueAtTime(1, when + CROSSFADE);

        source.connect(gain);
        gain.connect(this.outputGain);
        source.start(when, position);

        this.stopVoice(when);
        this.voice = { source, gain };
      }

      stopVoice(when = audioContext.currentTime) {
        if (!this.voice) {
          return;
        }

        const { source, gain } = this.voice;
        gain.gain.cancelScheduledValues(when);
        gain.gain.setValueAtTime(1, when);
        gain.gain.linearRampToValueAtTime(0, when + CROSSFADE);
        source.stop(when + CROSSFADE);
        source.onended = () => gain.disconnect();
        this.voice = null;
      }

      setOffset(value) {
        const d = this.loopDuration;
        // Keep the offset within half a loop on either side, it's circular anyway.
        this.offset = d ? mod(value + d / 2, d) - d / 2 : 0;
        const text = formatOffset(this.offset);
        this.screenOffset.textContent = `offset: ${text}`;
        this.waveformEl.setAttribute("aria-valuetext", text);
      }

      nudge(delta) {
        if (!this.loopBuffer) {
          return;
        }
        this.setOffset(this.offset + delta);
        this.restartVoice();
      }

      draw() {
        const canvas = this.waveformEl;
        const dpr = window.devicePixelRatio || 1;
        const w = Math.round(canvas.clientWidth * dpr);
        const h = Math.round(canvas.clientHeight * dpr);
        if (!w || !h) {
          return;
        }
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }

        const ctx = this.canvasCtx;
        ctx.clearRect(0, 0, w, h);

        const master = this.isMaster ? this : this.masterTrack;
        if (!this.peaks || !master.peaks) {
          ctx.fillStyle = "#fff2";
          ctx.fillRect(0, Math.floor(h / 2), w, 1);
          return;
        }

        // Guides: master loop boundaries, and quarters of the master loop.
        const guides = this.iterations * 4;
        for (let i = 1; i < guides; i++) {
          ctx.fillStyle = i % 4 === 0 ? "#fff6" : "#fff1";
          ctx.fillRect(Math.round(i / guides * w), 0, 1, h);
        }

        // The master waveform, in the background, as a reference.
        if (!this.isMaster) {
          drawPeaks(ctx, master.peaks, w, h, 0, this.iterations, "#ffffff40");
        }

        // This track's waveform, where it's actually heard relative to the master.
        const shift = mod(this.anchorTime + this.offset - master.anchorTime, this.loopDuration) / this.loopDuration;
        drawPeaks(ctx, this.peaks, w, h, -shift, 1, this.drag ? "#ff9a4dcc" : "#d25802cc");

        // Playhead, at what's currently being heard.
        const latency = (audioContext.outputLatency || 0) + (audioContext.baseLatency || 0);
        const heardTime = audioContext.currentTime - latency;
        const x = mod(heardTime - master.anchorTime, this.loopDuration) / this.loopDuration * w;
        ctx.fillStyle = "#fff";
        ctx.fillRect(Math.floor(x), 0, Math.max(1, Math.round(dpr)), h);
      }
    }

    class MicRecorder {
      constructor() {
        this.stream = null;
        this.node = null;
        this.isRecording = false;
        this.chunks = [];
        this.startFrame = null;
        this.stopTime = 0;
        this.inputLatency = 0;
      }

      async setup() {
        this.stream = await navigator.mediaDevices.getUserMedia({
          video: false,
          audio: {
            echoCancellation: false,
            autoGainControl: false,
            noiseSuppression: false,
            latency: 0
          }
        });

        const settings = this.stream.getAudioTracks()[0].getSettings();
        this.inputLatency = settings.latency || 0;

        const moduleUrl = URL.createObjectURL(new Blob([RECORDER_WORKLET], { type: "application/javascript" }));
        await audioContext.audioWorklet.addModule(moduleUrl);
        URL.revokeObjectURL(moduleUrl);

        const source = audioContext.createMediaStreamSource(this.stream);
        this.node = new AudioWorkletNode(audioContext, "recorder");
        // The worklet needs to be connected to the destination to get processed,
        // but we don't want to hear the mic.
        const silence = audioContext.createGain();
        silence.gain.value = 0;
        source.connect(this.node);
        this.node.connect(silence);
        silence.connect(audioContext.destination);

        this.node.port.onmessage = e => {
          if (e.data.type === "data") {
            if (this.startFrame === null) {
              this.startFrame = e.data.frame;
            }
            this.chunks.push(e.data.data);
          } else if (e.data.type === "stop") {
            this.onStopped();
          }
        };
      }

      getRoundTripLatency() {
        return (audioContext.outputLatency || 0) + (audioContext.baseLatency || 0) + this.inputLatency;
      }

      // Call this to start recording.
      startRecording() {
        if (this.isRecording) {
          return;
        }

        this.chunks = [];
        this.startFrame = null;
        this.isRecording = true;
        this.node.port.postMessage("start");
      }

      // Call this to stop recording.
      stopRecording() {
        if (!this.isRecording) {
          return;
        }

        this.isRecording = false;
        this.stopTime = audioContext.currentTime;
        this.node.port.postMessage("stop");
      }

      onStopped() {
        const sampleRate = audioContext.sampleRate;
        const startTime = this.startFrame === null ? 0 : this.startFrame / sampleRate;
        const totalLength = this.chunks.reduce((sum, chunk) => sum + chunk.length, 0);
        // Trim the frames that were recorded after the stop button was pressed.
        const wantedLength = Math.round((this.stopTime - startTime) * sampleRate);
        const length = Math.min(totalLength, Math.max(0, wantedLength));

        if (!length) {
          this.onBufferReady(null, 0);
          return;
        }

        const buffer = audioContext.createBuffer(1, length, sampleRate);
        const data = buffer.getChannelData(0);
        let pos = 0;
        for (const chunk of this.chunks) {
          if (pos >= length) {
            break;
          }
          data.set(chunk.subarray(0, length - pos), pos);
          pos += chunk.length;
        }
        this.chunks = [];

        this.onBufferReady(buffer, startTime);
      }

      // Override this to get the newly recorded buffer, and the audio context
      // time of its first frame.
      onBufferReady() { }
    }

    function clearAll() {
      tracks.forEach(track => {
        track.unmute();
        track.clear();
      });
    }

    function muteAll() {
      isAllMuted = !isAllMuted;

      tracks.forEach(track => {
        if (isAllMuted) {
          track.mute();
          muteAllButton.innerHTML = "<span>unmute all</span>";
        } else {
          track.unmute();
          muteAllButton.innerHTML = "<span>mute all</span>";
        }
      });
    }

    function addTrack() {
      const track = new Track(tracksEl, micRecorder, masterTrack);
      tracks.push(track);
    }

    function drawLoop() {
      tracks.forEach(track => track.draw());
      requestAnimationFrame(drawLoop);
    }

    async function start() {
      clearAll();
      tracks.forEach(track => track.outputGain.disconnect());
      tracks = [];
      masterTrack = null;

      tracksEl.innerHTML = "";

      // Create the audio context.
      if (!audioContext) {
        audioContext = new AudioContext({ latencyHint: "interactive" });
      }

      // Initialize the mic recorder.
      if (!micRecorder) {
        const recorder = new MicRecorder();
        await recorder.setup();
        micRecorder = recorder;
      }

      // Create the master track.
      masterTrack = new Track(tracksEl, micRecorder);
      tracks.push(masterTrack);

      // Create some more tracks.
      for (let i = 0; i < initTrackNb; i++) {
        addTrack();
      }

      // Show the main buttons.
      muteAllButton.hidden = false;
      addTrackButton.hidden = false;
      clearAllButton.hidden = false;

      startLooperButton.innerHTML = "<span>Restart</span>";

      if (!isDrawing) {
        isDrawing = true;
        drawLoop();
      }
    }

    clearAllButton.addEventListener("click", clearAll);
    muteAllButton.addEventListener("click", muteAll);
    addTrackButton.addEventListener("click", addTrack);
    startLooperButton.addEventListener('click', start);
  </script>
</body>
